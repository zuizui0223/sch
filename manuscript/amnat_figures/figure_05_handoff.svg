<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img"><title>Conditional SCH to SLK and BITA handoff</title><desc>Schematic showing theoretically possible post-identification payoff and dimensional decoupling, with empirical gate unmet.</desc><rect width="1600" height="1030" fill="#FFFFFF"/><text x="65" y="68" fill="#197D7C" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" >FIGURE 5</text><text x="65" y="123" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="700" text-anchor="start" >From identified conflict to architecture questions</text><text x="65" y="167" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" >A conditional scientific hand-off, not an empirically observed trait splitting event</text><line x1="65" y1="194" x2="1535" y2="194" stroke="#CDD5DB" stroke-width="2" /><rect x="65" y="235" width="1470" height="190" rx="17" fill="#EBF1FA" stroke="#CDD5DB" stroke-width="1.6"/><text x="110" y="283" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" >SCH: identify what the experiment actually shows</text><text x="110" y="337" fill="#3468A2" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="600" text-anchor="start" >Multifunctionality  →  opposing component responses  →  state-specific compromise</text><text x="110" y="390" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" >Export an empirical conflict budget L only if a common-scale identification gate passes.</text><line x1="800" y1="435" x2="800" y2="495" stroke="#202D3A" stroke-width="3" stroke-dasharray="10 6"/><text x="830" y="470" fill="#B34349" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" >GATE (not yet met)</text><rect x="65" y="525" width="695" height="275" rx="18" fill="#F6F8FA" stroke="#CDD5DB" stroke-width="1.6"/><rect x="800" y="525" width="735" height="275" rx="18" fill="#F6F8FA" stroke="#CDD5DB" stroke-width="1.6"/><text x="104" y="575" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="start" >SLK: architecture value</text><text x="105" y="638" fill="#3468A2" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" text-anchor="start" >Φ = s L − K</text><text x="107" y="695" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start" >Recoverable benefit − cost</text><text x="107" y="749" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" >Accessibility and invasion still need tests.</text><text x="839" y="575" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="start" >BITA: differentiated axes</text><text x="843" y="635" fill="#197D7C" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" >z (shared)  →  (x, y)</text><text x="842" y="696" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start" >Is the trait interaction a mechanism?</text><text x="842" y="749" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" >Decoupling and allocation need causal checks.</text><rect x="65" y="835" width="1470" height="104" rx="13" fill="#E8F3F1" stroke="#CDD5DB" stroke-width="1.6"/><text x="94" y="882" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" text-anchor="start" >THEORY: L = [a b / (a+b)] · (θ1 − θ2)²</text><text x="94" y="916" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start" >The theory expression is not the field-estimated L; neither Φ nor trait differentiation has been shown.</text><line x1="65" y1="963" x2="1535" y2="963" stroke="#CDD5DB" stroke-width="2" /><text x="65" y="1000" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start" >SCHEMATIC HAND-OFF • no empirical L, Phi, K or trait-splitting result</text></svg>
