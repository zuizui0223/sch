"#197D7C" stroke-width="3"/><circle cx="580" cy="447.75" r="7" fill="#FFFFFF" stroke="#197D7C" stroke-width="3"/><circle cx="740" cy="467" r="7" fill="#FFFFFF" stroke="#197D7C" stroke-width="3"/><circle cx="900" cy="574.8" r="7" fill="#FFFFFF" stroke="#197D7C" stroke-width="3"/><text x="1123" y="276" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" >B  WHAT IS IDENTIFIED</text><text x="1129" y="339" fill="#3468A2" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" >zP* = argmax W10(z)</text><text x="1129" y="395" fill="#BD673C" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" >zG* = argmax W01(z)</text><text x="1129" y="451" fill="#197D7C" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" >zC* = argmax W11(z)</text><line x1="1125" y1="479" x2="1501" y2="479" stroke="#CDD5DB" stroke-width="2" /><text x="1129" y="530" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" >C  NOT IDENTIFIED</text><text x="1130" y="597" fill="#B34349" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" text-anchor="start" >zP* ≠ automatically θ1</text><text x="1130" y="645" fill="#B34349" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" text-anchor="start" >zG* ≠ automatically θ2</text><text x="1129" y="724" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" >Pure-function optima need</text><text x="1129" y="755" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" >context-stability tests.</text><text x="110" y="858" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" >W00</text><line x1="180" y1="850" x2="228" y2="850" stroke="#566776" stroke-width="4" stroke-dasharray="11 7"/><text x="290" y="858" fill="#3468A2" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" >W10</text><line x1="360" y1="850" x2="408" y2="850" stroke="#3468A2" stroke-width="4" /><text x="463" y="858" fill="#BD673C" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" >W01</text><line x1="533" y1="850" x2="581" y2="850" stroke="#BD673C" stroke-width="4" stroke-dasharray="10 7"/><text x="637" y="858" fill="#197D7C" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" >W11</text><line x1="708" y1="850" x2="756" y2="850" stroke="#197D7C" stroke-width="4" /><line x1="65" y1="983" x2="1535" y2="983" stroke="#CDD5DB" stroke-width="2" /><text x="65" y="1020" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start" >SCHEMATIC ONLY • no estimated flower-rank optima or field trial represented</text></svg>
