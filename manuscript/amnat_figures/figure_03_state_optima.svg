<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img"><title>Four state-specific illustrative trait–fitness curves</title><desc>Hypothetical five-rank W00 W10 W01 W11 curves. The colored maxima are not inferred from measured data.</desc><rect width="1600" height="1050" fill="#FFFFFF"/><text x="65" y="68" fill="#197D7C" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" >FIGURE 3</text><text x="65" y="123" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="700" text-anchor="start" >State optima are not pure-function optima</text><text x="65" y="167" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" >Five assigned floral-trait ranks across four selective ecological states — illustrative curves</text><line x1="65" y1="194" x2="1535" y2="194" stroke="#CDD5DB" stroke-width="2" /><rect x="65" y="225" width="1000" height="660" rx="18" fill="#F6F8FA" stroke="#CDD5DB" stroke-width="1.6"/><rect x="1095" y="225" width="440" height="660" rx="18" fill="#F6F8FA" stroke="#CDD5DB" stroke-width="1.6"/><text x="100" y="270" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" >A  FITNESSES IN FOUR ECOLOGICAL STATES</text><line x1="180" y1="775" x2="960" y2="775" stroke="#202D3A" stroke-width="3" /><line x1="180" y1="775" x2="180" y2="390" stroke="#202D3A" stroke-width="3" /><line x1="180" y1="775" x2="960" y2="775" stroke="#CDD5DB" stroke-width="1" /><text x="161" y="783" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="end" >0</text><line x1="180" y1="678.75" x2="960" y2="678.75" stroke="#CDD5DB" stroke-width="1" /><text x="161" y="686.75" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="end" >2.5</text><line x1="180" y1="582.5" x2="960" y2="582.5" stroke="#CDD5DB" stroke-width="1" /><text x="161" y="590.5" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="end" >5</text><line x1="180" y1="486.25" x2="960" y2="486.25" stroke="#CDD5DB" stroke-width="1" /><text x="161" y="494.25" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="end" >7.5</text><line x1="180" y1="390" x2="960" y2="390" stroke="#CDD5DB" stroke-width="1" /><text x="161" y="398" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="end" >10</text><text x="97" y="490" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="middle" transform="rotate(-90 97 490)">viable-seed fitness</text><line x1="260" y1="775" x2="260" y2="785" stroke="#202D3A" stroke-width="2" /><text x="260" y="817" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="middle" >z1</text><line x1="420" y1="775" x2="420" y2="785" stroke="#202D3A" stroke-width="2" /><text x="420" y="817" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="middle" >z2</text><line x1="580" y1="775" x2="580" y2="785" stroke="#202D3A" stroke-width="2" /><text x="580" y="817" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="middle" >z3</text><line x1="740" y1="775" x2="740" y2="785" stroke="#202D3A" stroke-width="2" /><text x="740" y="817" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="middle" >z4</text><line x1="900" y1="775" x2="900" y2="785" stroke="#202D3A" stroke-width="2" /><text x="900" y="817" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="middle" >z5</text><polyline points="260,682.6 420,613.3 580,559.4 740,582.5 900,647.95" fill="none" strok