<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img"><title>Eight-cell manipulation and identification ladder</title><desc>Factorial schematic showing architecture A and consumer states P and G; source-free conceptual design.</desc><rect width="1600" height="1050" fill="#FFFFFF"/><text x="65" y="68" fill="#197D7C" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" >FIGURE 2</text><text x="65" y="123" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="700" text-anchor="start" >Selective factorial design distinguishes functions</text><text x="65" y="167" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" >Experimental identification requirements; a response to the trait is not a causal component</text><line x1="65" y1="194" x2="1535" y2="194" stroke="#CDD5DB" stroke-width="2" /><rect x="65" y="225" width="1470" height="245" rx="18" fill="#F6F8FA" stroke="#CDD5DB" stroke-width="1.6"/><text x="100" y="275" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="start" >A  EXPERIMENTAL FACTORIAL (two architecture states × P × G)</text><rect x="180" y="312" width="270" height="88" rx="9" fill="#FFFFFF" stroke="#CDD5DB" stroke-width="1.6"/><text x="315" y="347" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" >P0 · G0</text><text x="315" y="377" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="middle" >Y[A, 0,0]</text><rect x="515" y="312" width="270" height="88" rx="9" fill="#FFFFFF" stroke="#CDD5DB" stroke-width="1.6"/><text x="650" y="347" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" >P1 · G0</text><text x="650" y="377" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="middle" >Y[A, 1,0]</text><rect x="850" y="312" width="270" height="88" rx="9" fill="#FFFFFF" stroke="#CDD5DB" stroke-width="1.6"/><text x="985" y="347" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" >P0 · G1</text><text x="985" y="377" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="middle" >Y[A, 0,1]</text><rect x="1185" y="312" width="270" height="88" rx="9" fill="#FFFFFF" stroke="#CDD5DB" stroke-width="1.6"/><text x="1320" y="347" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" >P1 · G1</text><text x="1320" y="377" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="middle" >Y[A, 1,1]</text><text x="102" y="438" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start" >Each cell requires verified consumer assignment, sham controls and a common fitness endpoint.</text><rect x="65" y="503" width="710" height="350" rx="18" fill="#F6F8FA" stroke="#CDD5DB" stroke-width="1.6"/><rect x="806" y="503" width="729" height="350" rx="18" fill="#F6F8FA" stroke="#CDD5DB" stroke-width="1.6"/><text x="93" y="551" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" >B  TRAIT-DEPENDENT COMPONENT CONTRASTS</text><text x="107" y="620" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" >Pollinator contribution at G0:</text><text x="112" y="657" fill="#3468A2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="600" text-anchor="start" >M_G0(z) = W10(z) − W00(z)</text><text x="107" y="718" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" >Antagonist contribution at P0:</text><text x="112" y="756" fill="#BD673C" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="600" text-anchor="start" >H_P0(z) = W01(z) − W00(z)</text><text x="835" y="551" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" >C  WHAT THE DATA CAN PROMOTE</text><circle cx="853" cy="600" r="7" fill="#3468A2" stroke="none" stroke-width="1"/><text x="875" y="605" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start" >Multifunctional response</text><text x="875" y="629" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" >Same trait influences ≥2 outputs</text><circle cx="853" cy="659" r="7" fill="#BD673C" stroke="none" stroke-width="1"/><text x="875" y="664" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start" >Functional conflict</text><text x="875" y="688" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" >Opposing effects on a common scale</text><circle cx="853" cy="718" r="7" fill="#197D7C" stroke="none" stroke-width="1"/><text x="875" y="723" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start" >State-specific optimum</text><text x="875" y="747" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" >Multi-level assigned z × P × G</text><circle cx="853" cy="777" r="7" fill="#73559B" stroke="none" stroke-width="1"/><text x="875" y="782" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start" >Pure-function optimum</text><text x="875" y="806" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" >Context-stable components + equivalence</text><text x="102" y="924" fill="#202D3A" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" text-anchor="start" >A statistically significant interaction is not automatically a causal mechanism or pure optimum.</text><line x1="65" y1="983" x2="1535" y2="983" stroke="#CDD5DB" stroke-width="2" /><text x="65" y="1020" fill="#566776" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start" >SCHEMATIC DESIGN • no P. rex implementation of this eight-cell factorial is claimed</text></svg>
