<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img"><title>Factorial architecture and ecological state identification</title><desc>Eight theoretical cells in two architecture conditions by two pollination by two antagonist states. All are schematic and unmeasured.</desc><rect width="1600" height="1050" fill="white"/><text x="65" y="68" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#197D7C">FIGURE 2</text><text x="65" y="123" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" text-anchor="start" fill="#202D3A">Selective interventions identify state effects, not pure functions</text><text x="65" y="167" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#566776">An eight-cell design across two architectures and four ecological states</text><line x1="65" y1="194" x2="1535" y2="194" stroke="#CDD5DB" stroke-width="2"/><rect x="65" y="225" width="1470" height="330" rx="13" fill="#F6F8FA" stroke="#CDD5DB" stroke-width="1.8"/><text x="95" y="267" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#202D3A">A  EIGHT ARCHITECTURE × POLLINATOR × ANTAGONIST CELLS</text><text x="95" y="347" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#3468A2">A0: shared</text><rect x="252" y="310" width="267" height="66" rx="8" fill="#EDF2FA" stroke="#CDD5DB" stroke-width="1.8"/><text x="385" y="337" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#202D3A">P0 | G0</text><text x="385" y="362" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#3468A2">W[0,00](z)</text><rect x="553" y="310" width="267" height="66" rx="8" fill="#EDF2FA" stroke="#CDD5DB" stroke-width="1.8"/><text x="686" y="337" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#202D3A">P1 | G0</text><text x="686" y="362" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#3468A2">W[0,10](z)</text><rect x="854" y="310" width="267" height="66" rx="8" fill="#EDF2FA" stroke="#CDD5DB" stroke-width="1.8"/><text x="987" y="337" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#202D3A">P0 | G1</text><text x="987" y="362" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#3468A2">W[0,01](z)</text><rect x="1155" y="310" width="267" height="66" rx="8" fill="#EDF2FA" stroke="#CDD5DB" stroke-width="1.8"/><text x="1288" y="337" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#202D3A">P1 | G1</text><text x="1288" y="362" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#3468A2">W[0,11](z)</text><text x="95" y="436" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#197D7C">A1: split</text><rect x="252" y="399" width="267" height="66" rx="8" fill="#EBF5F2" stroke="#CDD5DB" stroke-width="1.8"/><text x="385" y="426" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#202D3A">P0 | G0</text><text x="385" y="451" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#197D7C">W[1,00](z)</text><rect x="553" y="399" width="267" height="66" rx="8" fill="#EBF5F2" stroke="#CDD5DB" stroke-width="1.8"/><text x="686" y="426" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#202D3A">P1 | G0</text><text x="686" y="451" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#197D7C">W[1,10](z)</text><rect x="854" y="399" width="267" height="66" rx="8" fill="#EBF5F2" stroke="#CDD5DB" stroke-width="1.8"/><text x="987" y="426" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#202D3A">P0 | G1</text><text x="987" y="451" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#197D7C">W[1,01](z)</text><rect x="1155" y="399" width="267" height="66" rx="8" fill="#EBF5F2" stroke="#CDD5DB" stroke-width="1.8"/><text x="1288" y="426" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#202D3A">P1 | G1</text><text x="1288" y="451" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#197D7C">W[1,11](z)</text><text x="95" y="516" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#566776">All eight cells require common, source-verified reproductive outcomes and selective controls.</text><rect x="65" y="584" width="710" height="314" rx="13" fill="#F6F8FA" stroke="#CDD5DB" stroke-width="1.8"/><rect x="806" y="584" width="729" height="314" rx="13" fill="#F6F8FA" stroke="#CDD5DB" stroke-width="1.8"/><text x="94" y="625" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#202D3A">B  DECLARED CAUSAL COMPONENTS</text><text x="103" y="681" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#566776">Pollination gain at G0</text><text x="104" y="721" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#3468A2">M_G0(z) = W10(z) − W00(z)</text><text x="103" y="775" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#566776">Antagonist contribution at P0</text><text x="104" y="815" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#BD673C">H_P0(z) = W01(z) − W00(z)</text><text x="836" y="625" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#202D3A">C  EVIDENCE GATES</text><text x="839" y="680" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#3468A2">L0</text><text x="928" y="680" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#202D3A">one trait serves two functions</text><text x="839" y="732" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#BD673C">L1</text><text x="928" y="732" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#202D3A">opposing causal contributions</text><text x="839" y="784" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#197D7C">L2</text><text x="928" y="784" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#202D3A">separate state-specific optima</text><text x="839" y="836" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#73559B">L3–4</text><text x="928" y="836" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#202D3A">selective shifts and stability tests</text><text x="92" y="947" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" text-anchor="start" fill="#202D3A">A significant trait interaction alone does not prove functional conflict or component-optimum equality.</text><line x1="65" y1="982" x2="1535" y2="982" stroke="#CDD5DB" stroke-width="2"/><text x="65" y="1017" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#566776">SCHEMATIC DESIGN • no eight-cell floral study in the SCH source ledger satisfies all causal gates</text></svg>
