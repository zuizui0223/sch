name: promote-sch-prisma-v21-docs-temp

on:
  push:
    branches:
      - analysis/prisma-batch4-fulltext-v21

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/prisma-batch4-fulltext-v21
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synchronize V21 documentation and manuscript
        run: python scripts/promote_sch_prisma_v21_docs_temp.py
      - name: Validate synchronized state
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_sch_prisma_current_screening_state.py tests/test_sch_bita_scope_contract.py
          grep -q 'primary studies included:        122' docs/PUBLICATION_MATERIAL_LEDGER.md
          grep -q 'joint geography + receiver records:     24' docs/SCH_PRISMA_V21_BATCH4_REMAINDER_FULLTEXT_READOUT.md
          grep -q 'Willmer floral-VOC receiver filter' manuscript/MANUSCRIPT_SHARED_CUE_FRAMEWORK.md
      - name: Commit V21 synchronization
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PUBLICATION_MATERIAL_LEDGER.md docs/SCH_JBI_GEOGRAPHY_PREVIEW_READOUT_V1.md docs/SCH_PRISMA_V21_BATCH4_REMAINDER_FULLTEXT_READOUT.md manuscript/MANUSCRIPT_SHARED_CUE_FRAMEWORK.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Synchronize V21 Batch 4 full-text closure'
          git push origin HEAD:analysis/prisma-batch4-fulltext-v21
