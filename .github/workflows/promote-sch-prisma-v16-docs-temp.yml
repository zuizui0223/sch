name: promote-sch-prisma-v16-docs-temp

on:
  push:
    branches:
      - analysis/prisma-batch3-remainder-v16

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/prisma-batch3-remainder-v16
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synchronize V16 documentation
        run: python scripts/promote_sch_prisma_v16_docs_temp.py
      - name: Validate and commit
        run: |
          set -euo pipefail
          grep -q 'title/abstract screened:         307' docs/PUBLICATION_MATERIAL_LEDGER.md
          grep -q 'full title/abstract screening:          NO (561 remaining)' docs/SCH_JBI_GEOGRAPHY_PREVIEW_READOUT_V1.md
          grep -q 'Batch-3 TA completion:                  100/100' docs/SCH_PRISMA_V16_BATCH3_REMAINDER_TA_READOUT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PUBLICATION_MATERIAL_LEDGER.md docs/SCH_JBI_GEOGRAPHY_PREVIEW_READOUT_V1.md docs/SCH_PRISMA_V16_BATCH3_REMAINDER_TA_READOUT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Synchronize V16 Batch 3 title-abstract closure'
          git push origin HEAD:analysis/prisma-batch3-remainder-v16
