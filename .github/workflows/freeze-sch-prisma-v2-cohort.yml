name: Freeze SCH PRISMA V2 cohort

on:
  pull_request:
    paths:
      - '.github/workflows/freeze-sch-prisma-v2-cohort.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Recover frozen 868-candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frozen" empirical/prisma/frozen_v2
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9711001666/zip \
            -o "$RUNNER_TEMP/frozen.zip"
          unzip -q "$RUNNER_TEMP/frozen.zip" -d "$RUNNER_TEMP/frozen"
          cp "$RUNNER_TEMP/frozen/SCH_PRISMA_V2_IDENTIFIED_CANDIDATES.csv" \
            empirical/prisma/frozen_v2/SCH_PRISMA_V2_IDENTIFIED_CANDIDATES_FROZEN_2026-08-29.csv
          cp "$RUNNER_TEMP/frozen/SCH_PRISMA_V2_IDENTIFICATION_RECEIPT.json" \
            empirical/prisma/frozen_v2/SCH_PRISMA_V2_IDENTIFICATION_RECEIPT_FROZEN_2026-08-29.json
          test "$(($(wc -l < empirical/prisma/frozen_v2/SCH_PRISMA_V2_IDENTIFIED_CANDIDATES_FROZEN_2026-08-29.csv)-1))" -eq 868
          echo 'ee85f56ae500be17ed45f9010b0a75fa8f6b741b0967db5af596b2d7bb8579a0  empirical/prisma/frozen_v2/SCH_PRISMA_V2_IDENTIFIED_CANDIDATES_FROZEN_2026-08-29.csv' | sha256sum -c -
      - name: Commit frozen cohort once
        run: |
          set -euo pipefail
          if git diff --quiet -- empirical/prisma/frozen_v2; then
            echo 'Frozen cohort already present; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add empirical/prisma/frozen_v2
          git commit -m 'Freeze SCH PRISMA V2 868-record cohort'
          git push origin HEAD:${{ github.head_ref }}
