name: P. rex plant-pair Fisher randomization checks

on:
  pull_request:
    paths:
      - 'scripts/fisher_pedicularis_plant_pair_G_randomization.py'
      - 'tests/test_pedicularis_plant_pair_fisher_randomization.py'
      - '.github/workflows/sch_p_rex_plant_pair_fisher.yml'
  workflow_dispatch:

jobs:
  conditional-sharp-null:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test runner
        run: python -m pip install pytest
      - name: Verify exact whole-plant null randomization and Monte Carlo correction
        run: |
          python -m pytest -q tests/test_pedicularis_plant_pair_fisher_randomization.py
