name: promote-sch-prisma-v20-docs-temp

on:
  push:
    branches:
      - analysis/prisma-batch4-remainder-v20

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/prisma-batch4-remainder-v20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synchronize V20 docs
        run: python scripts/promote_sch_prisma_v20_docs_temp.py
      - name: Validate synchronized state
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_sch_prisma_current_screening_state.py tests/test_sch_bita_scope_contract.py
          grep -q 'title/abstract screened:         405' docs/PUBLICATION_MATERIAL_LEDGER.md
          grep -q 'current retained full-text backlog:     29' docs/SCH_JBI_GEOGRAPHY_PREVIEW_READOUT_V1.md
          grep -q 'title/abstract screened:               405' docs/SCH_PRISMA_V20_BATCH4_REMAINDER_TITLE_ABSTRACT_READOUT.md
      - name: Commit synchronized docs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PUBLICATION_MATERIAL_LEDGER.md docs/SCH_JBI_GEOGRAPHY_PREVIEW_READOUT_V1.md docs/SCH_PRISMA_V20_BATCH4_REMAINDER_TITLE_ABSTRACT_READOUT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Synchronize V20 Batch 4 title-abstract closure'
          git push origin HEAD:analysis/prisma-batch4-remainder-v20
