name: fix-sch-prisma-v17-csv-temp

on:
  push:
    branches:
      - analysis/prisma-batch3-fulltext-v17

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/prisma-batch3-fulltext-v17
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Normalize V17 overlay to 21-column schema
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          path=Path('empirical/prisma/SCH_PRISMA_V2_SCREENING_DECISIONS_V17_BATCH3_REMAINDER_FULLTEXT.csv')
          with path.open(encoding='utf-8',newline='') as h:
              rows=list(csv.reader(h))
          header=rows[0]
          assert len(header)==21, len(header)
          fixed=[]
          repaired=0
          for n,row in enumerate(rows[1:],start=2):
              if len(row)==22:
                  assert row[2]=='EXCLUDE', (n,row[:5])
                  assert row[20].startswith('SOURCE_VERIFIED_BATCH3_REMAINDER_FULLTEXT_V17_'), (n,row[20])
                  assert all(value=='' for value in row[4:20]), (n,row[4:20])
                  del row[19]
                  repaired += 1
              assert len(row)==21, (n,len(row),row)
              fixed.append(row)
          assert len(fixed)==44, len(fixed)
          decisions=Counter(row[2] for row in fixed)
          assert decisions=={'INCLUDE':16,'EXCLUDE':28}, decisions
          assert repaired==28, repaired
          with path.open('w',encoding='utf-8',newline='') as h:
              w=csv.writer(h,lineterminator='\n')
              w.writerow(header)
              w.writerows(fixed)
          print({'rows':len(fixed),'repaired':repaired,'decisions':dict(decisions)})
          PY
      - name: Validate overlay application
        run: |
          set -euo pipefail
          FROZEN=empirical/prisma/frozen_v2/SCH_PRISMA_V2_IDENTIFIED_CANDIDATES_FROZEN_2026-08-29.csv
          mkdir -p artifacts/v17repair
          python scripts/build_sch_prisma_screening_batches.py "$FROZEN" artifacts/v17repair/base --batch-size 100
          SRC=artifacts/v17repair/base
          mapfile -t overlays < <(find empirical/prisma -maxdepth 1 -type f -name 'SCH_PRISMA_V2_SCREENING_DECISIONS_V*.csv' -print | sort -V)
          for i in "${!overlays[@]}"; do
            n=$((i+1)); OUT="artifacts/v17repair/active_${n}"
            python scripts/apply_sch_prisma_screening_decisions.py "$SRC" "${overlays[$i]}" "$OUT" "artifacts/v17repair/overlay_${n}.json" --expected-denominator 868
            SRC="$OUT"
          done
          python scripts/audit_sch_prisma_screening.py "$SRC" artifacts/v17repair/audit.json --expected-denominator 868
          cat artifacts/v17repair/audit.json
      - name: Commit repaired overlay
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add empirical/prisma/SCH_PRISMA_V2_SCREENING_DECISIONS_V17_BATCH3_REMAINDER_FULLTEXT.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair V17 screening overlay CSV schema'
          git push origin HEAD:analysis/prisma-batch3-fulltext-v17
