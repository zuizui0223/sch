name: SCH milkweed genuine source flower-opportunity denominator audit
on:
  push:
    paths:
      - 'scripts/analyze_sch_milkweed_2024_flower_opportunity.py'
      - 'tests/test_sch_milkweed_2024_flower_opportunity.py'
      - '.github/workflows/sch_milkweed_2024_flower_opportunity.yml'
      - 'docs/SCH_MILKWEED_2024_FLOWER_OPPORTUNITY_DENOMINATOR_V1.md'
  pull_request:
    paths:
      - 'scripts/analyze_sch_milkweed_2024_flower_opportunity.py'
      - 'tests/test_sch_milkweed_2024_flower_opportunity.py'
      - '.github/workflows/sch_milkweed_2024_flower_opportunity.yml'
      - 'docs/SCH_MILKWEED_2024_FLOWER_OPPORTUNITY_DENOMINATOR_V1.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-flower-opportunity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only original XLSX and numeric reanalysis dependencies
        run: python -m pip install --quiet openpyxl numpy pytest
      - name: Source unit and no-causal-conversion test
        run: python -m pytest -q tests/test_sch_milkweed_2024_flower_opportunity.py
      - name: Re-ingest official original 2024 XLSX and verify pinned SHA256
        run: python -m scripts.ingest_sch_milkweed_2024_original_appendix --outdir artifacts/sch_milkweed_flower_opportunity
      - name: Compute honest source-total-flower opportunity sensitivity with paired 102-plant-label bootstrap
        run: >-
          python -m scripts.analyze_sch_milkweed_2024_flower_opportunity
          --source artifacts/sch_milkweed_flower_opportunity/original_2024_jpe_appendix_ii.xlsx
          --output artifacts/sch_milkweed_flower_opportunity/source_flower_opportunity_v1.json
          --boot 1999
      - name: Check source grain and computed result contains noncausal denominator sensitivity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/sch_milkweed_flower_opportunity/source_flower_opportunity_v1.json").read_text())
          assert r["original_source_SHA256"]=="d5beb695f1c5f81f03eb74a18937582e99fc2cd1c23bda3598e33ef904bfadfb"
          assert r["n_original_published_rows"]==103
          assert r["n_distinct_source_plant_labels"]==102
          assert r["n_successful_plant_label_bootstrap"]>=1500
          assert len(r["unadjusted_count_based_paired_stage_contrast_per_trait"])==10
          assert abs(r["published_selection_original_raw_inflorescence_delta"]-.4835837049)<1e-6
          assert r["no_causal_stage_conversion_rate"] is True
          assert r["no_pure_function_optima_or_SCH_L"] is True
          print("PASSED_ORIGINAL_2024_SOURCE_FLOWER_OPPORTUNITY")
          PY
      - name: Retain authenticated source and numeric sensitivity result
        uses: actions/upload-artifact@v4
        with:
          name: sch-milkweed-2024-genuine-flower-opportunity-v1
          path: artifacts/sch_milkweed_flower_opportunity/
          if-no-files-found: error
          retention-days: 15
