name: Build SCH PRISMA Batch 2 triage

on:
  pull_request:
    paths:
      - '.github/workflows/build-sch-prisma-batch2-triage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Batch 2 abstract-free triage
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/batches" empirical/prisma/triage
          python scripts/build_sch_prisma_screening_batches.py \
            empirical/prisma/frozen_v2/SCH_PRISMA_V2_IDENTIFIED_CANDIDATES_FROZEN_2026-08-29.csv \
            "$RUNNER_TEMP/batches" \
            --batch-size 100
          python scripts/build_sch_prisma_screening_triage.py \
            "$RUNNER_TEMP/batches/SCH_PRISMA_V2_SCREEN_BATCH_02.csv" \
            empirical/prisma/triage/SCH_PRISMA_V2_BATCH_02_MACHINE_TRIAGE.csv \
            empirical/prisma/triage/SCH_PRISMA_V2_BATCH_02_MACHINE_TRIAGE_RECEIPT.json
          python scripts/build_sch_prisma_human_review_queue.py \
            empirical/prisma/triage/SCH_PRISMA_V2_BATCH_02_MACHINE_TRIAGE.csv \
            empirical/prisma/triage/SCH_PRISMA_V2_BATCH_02_HIGH_INFORMATION_QUEUE.csv \
            empirical/prisma/triage/SCH_PRISMA_V2_BATCH_02_HIGH_INFORMATION_QUEUE_RECEIPT.json
          python - <<'PY'
          import csv, json
          from pathlib import Path
          triage = list(csv.DictReader(Path('empirical/prisma/triage/SCH_PRISMA_V2_BATCH_02_MACHINE_TRIAGE.csv').open(encoding='utf-8', newline='')))
          receipt = json.loads(Path('empirical/prisma/triage/SCH_PRISMA_V2_BATCH_02_MACHINE_TRIAGE_RECEIPT.json').read_text())
          assert len(triage) == 100
          assert receipt['candidate_count'] == 100
          assert receipt['stored_abstracts'] is False
          assert receipt['formal_decisions_written'] is False
          assert all(row['formal_title_abstract_decision'] == '' for row in triage)
          assert all(row['formal_title_abstract_reason'] == '' for row in triage)
          assert 'abstract' not in {name.lower() for name in triage[0]}
          PY
      - name: Commit Batch 2 triage packet
        run: |
          set -euo pipefail
          git add empirical/prisma/triage/SCH_PRISMA_V2_BATCH_02_*
          if git diff --cached --quiet; then
            echo 'Batch 2 triage already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build SCH PRISMA Batch 2 triage packet'
          git push origin HEAD:${{ github.head_ref }}
