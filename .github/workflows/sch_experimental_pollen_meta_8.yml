name: SCH eight-programme experimental pollen meta pilot

on:
  push:
    branches:
      - empirical/meta-directional-floral-selection-20261028
    paths:
      - scripts/analyze_sch_experimental_pollen_meta_8_programmes.py
      - tests/test_sch_experimental_pollen_meta_8_programmes.py
      - .github/workflows/sch_experimental_pollen_meta_8.yml
      - data/SCH_META_ACONITUM_2016_SOURCE_TABLE3_SELECTION_V1.csv
      - data/SCH_META_LOBELIA_SIPHILITICA_2023_SOURCE_TABLE2_SELECTION_V1.csv
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source QA dependencies
        run: python -m pip install --quiet pytest
      - name: Check all original programme denominators and source fidelity
        run: python -m pytest -q tests/test_sch_experimental_pollen_meta_8_programmes.py
      - name: Independently calculate exact experiment-level signs and bounded numeric pilot
        run: |
          python -m scripts.analyze_sch_experimental_pollen_meta_8_programmes --output artifacts/sch_meta/eight_programme_source_pilot.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/sch_meta/eight_programme_source_pilot.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          print("BEGIN_SCH_EIGHT_PROGRAMME_PRIMARY_NUMERIC_RECEIPT")
          print(json.dumps(data,indent=2,sort_keys=True))
          print("END_SCH_EIGHT_PROGRAMME_PRIMARY_NUMERIC_RECEIPT")
          PY
      - name: Preserve the original-study numerical meta receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sch-eight-programme-meta-pilot
          path: artifacts/sch_meta/
          if-no-files-found: error
          retention-days: 15
