name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python scripts/build_one_trait_coverage_audit.py
      - name: Core code tests
        run: python -m pytest -m "not prose_contract"
      - name: Prose contract audit (advisory)
        continue-on-error: true
        run: python -m pytest -m prose_contract
