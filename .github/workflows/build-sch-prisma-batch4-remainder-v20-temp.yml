name: build-sch-prisma-batch4-remainder-v20-temp

on:
  push:
    branches:
      - analysis/prisma-batch4-remainder-v20

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/prisma-batch4-remainder-v20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact Batch 4 remainder queue
        run: |
          python - <<'PY'
          import csv, json, re
          from pathlib import Path

          root=Path('.')
          prisma=root/'empirical/prisma'
          triage=prisma/'triage/SCH_PRISMA_V2_BATCH_04_MACHINE_TRIAGE.csv'
          rx=re.compile(r'SCREENING_DECISIONS_V(\d+)')
          overlays=sorted(prisma.glob('SCH_PRISMA_V2_SCREENING_DECISIONS_V*.csv'), key=lambda p:int(rx.search(p.name).group(1)))
          assert [int(rx.search(p.name).group(1)) for p in overlays]==list(range(1,20))
          decided={}
          for p in overlays:
              with p.open(encoding='utf-8',newline='') as h:
                  for row in csv.DictReader(h):
                      v=(row.get('screen_title_abstract') or '').strip()
                      if v: decided[row['record_id']]=v
          with triage.open(encoding='utf-8',newline='') as h:
              rows=[{k:(v or '').strip() for k,v in row.items()} for row in csv.DictReader(h)]
          batch=[r for r in rows if 301 <= int(r['record_id'].split('-')[-1]) <= 400]
          assert len(batch)==100
          rem=[r for r in batch if r['record_id'] not in decided]
          assert len(rem)==41, len(rem)
          out=prisma/'triage/SCH_PRISMA_V2_BATCH_04_REMAINDER_QUEUE.csv'
          fields=list(rem[0].keys())+['human_title_abstract_decision','human_title_abstract_reason','human_note']
          with out.open('w',encoding='utf-8',newline='') as h:
              w=csv.DictWriter(h,fieldnames=fields)
              w.writeheader()
              for r in rem:
                  r=dict(r)
                  r.update(human_title_abstract_decision='',human_title_abstract_reason='',human_note='')
                  w.writerow(r)
          receipt={
              'analysis_id':'sch_prisma_v2_batch4_remainder_queue_v1',
              'batch4_frozen_count':100,
              'decided_before_v20':59,
              'remaining_count':41,
              'record_ids':[r['record_id'] for r in rem],
              'priority_counts':{},
              'formal_prisma_decisions_written':False,
              'claim_boundary':'Queue is review assistance only; V20 must write formal decisions separately.'
          }
          for r in rem:
              p=r.get('machine_priority','UNKNOWN')
              receipt['priority_counts'][p]=receipt['priority_counts'].get(p,0)+1
          (prisma/'triage/SCH_PRISMA_V2_BATCH_04_REMAINDER_QUEUE_RECEIPT.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          print(json.dumps({'remaining':41,'priority_counts':receipt['priority_counts']}))
          PY
      - name: Commit remainder queue
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add empirical/prisma/triage/SCH_PRISMA_V2_BATCH_04_REMAINDER_QUEUE.csv empirical/prisma/triage/SCH_PRISMA_V2_BATCH_04_REMAINDER_QUEUE_RECEIPT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build Batch 4 remainder screening queue'
          git push origin HEAD:analysis/prisma-batch4-remainder-v20
