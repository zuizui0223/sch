name: SCH original blueberry first-vs-additional visits and 4 pollen protocols
on:
  push:
    paths:
      - 'scripts/analyze_sch_blueberry_2020_first_additional_gates.py'
      - 'tests/test_sch_blueberry_2020_first_additional_gates.py'
      - 'docs/SCH_BLUEBERRY_2020_FIRST_VS_ADDITIONAL_GATES_V1.md'
      - 'data/SCH_BLUEBERRY_2020_FIRST_ADDITIONAL_GATE_RESULTS_V1.csv'
      - 'data/SCH_BLUEBERRY_2020_ZERO_TO_ONE_SITE_RISKS_V1.csv'
      - 'data/SCH_BLUEBERRY_2020_FOUR_POLLINATION_PROTOCOL_RATES_V1.csv'
      - '.github/workflows/sch_blueberry_2020_first_additional_gates.yml'
  pull_request:
    paths:
      - 'scripts/analyze_sch_blueberry_2020_first_additional_gates.py'
      - 'tests/test_sch_blueberry_2020_first_additional_gates.py'
      - 'docs/SCH_BLUEBERRY_2020_FIRST_VS_ADDITIONAL_GATES_V1.md'
      - 'data/SCH_BLUEBERRY_2020_FIRST_ADDITIONAL_GATE_RESULTS_V1.csv'
      - 'data/SCH_BLUEBERRY_2020_ZERO_TO_ONE_SITE_RISKS_V1.csv'
      - 'data/SCH_BLUEBERRY_2020_FOUR_POLLINATION_PROTOCOL_RATES_V1.csv'
      - '.github/workflows/sch_blueberry_2020_first_additional_gates.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-tagged-flower-site-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original flower source binomial regression dependencies
        run: python -m pip install --quiet numpy scipy statsmodels pytest
      - name: Test original source grain and causal interpretation guardrails
        run: python -m pytest -q tests/test_sch_blueberry_2020_first_additional_gates.py
      - name: Recover MD5-verified publisher original blueberry flower CSVs
        uses: actions/download-artifact@v4
        with:
          name: sch-original-2020-blueberry-flower-source
          run-id: 43907335688
          github-token: ${{ github.token }}
          path: artifacts/sch_blueberry_first_gate/
      - name: Fit original flower 0-to-1 vs 1-to-5 visitation and site-matched four pollen protocol descriptives
        run: >-
          python -m scripts.analyze_sch_blueberry_2020_first_additional_gates
          --source_dir artifacts/sch_blueberry_first_gate/
          --output artifacts/sch_blueberry_first_gate/first_additional_gate_source.json
      - name: Verify complete source flower, plant and site denominators
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path("artifacts/sch_blueberry_first_gate/first_additional_gate_source.json").read_text())
          assert d["n_original_published_programmes"]==1
          assert d["n_original_tagged_flower_visit_rows"]==2080
          assert d["n_original_tagged_flower_pollination_rows"]==2125
          a=d["source_visit_0to5_piecewise"]
          assert a["n_original_flower_rows"]==1849
          assert a["n_original_plant_labels"]==238
          assert abs(a["three_source_type_effect_heterogeneity"]["first"]["nominal_chi2_P"]-.00155070487605)<.00000001
          assert abs(a["three_source_type_effect_heterogeneity"]["additional"]["nominal_chi2_P"]-.6773288775868)<.00000001
          sites=d["source_visit_site_only_zero_and_one_overlap_sensitivity"]
          assert sites["n_original_qualifying_year_blocks"]==9
          assert sites["n_source_flower_rows"]==1803
          assert sites["site_only_estimates"]["n_original_plant_labels"]==222
          assert abs(sites["site_only_estimates"]["three_source_type_effect_heterogeneity"]["first"]["nominal_chi2_P"]-.00156778702351)<.00000001
          assert abs(sites["site_only_estimates"]["three_source_type_effect_heterogeneity"]["additional"]["nominal_chi2_P"]-.756599483979)<.00000001
          assert len(a["source_type_first_and_additional_visit_effects"])==3
          assert len(a["source_rabbiteye_vs_highbush_effect_differences"])==2
          assert d["no_compatible_pollen_fertilization_or_mechanistic_gate_measured"] is True
          assert d["no_SCH_same_trait_function_specific_optima_or_loss_L"] is True
          print("VERIFIED_PUBLISHED_BLUEBERRY_FLOWER_SOURCE_TWO_VISIT_PROCESS")
          PY
      - name: Preserve original CSV and real site-cluster source findings
        uses: actions/upload-artifact@v4
        with:
          name: sch-blueberry-original-first-and-additional-visit-gates-v1
          path: artifacts/sch_blueberry_first_gate/
          retention-days: 20
          if-no-files-found: error
