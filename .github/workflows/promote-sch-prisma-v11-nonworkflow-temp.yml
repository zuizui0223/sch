name: promote-sch-prisma-v11-nonworkflow-temp

on:
  push:
    branches:
      - analysis/prisma-batch2-fulltext-closure-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/prisma-batch2-fulltext-closure-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synchronize V11 tests docs and manuscript
        run: |
          python - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text: raise RuntimeError(f'{path}: missing {old[:80]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          test='tests/test_sch_prisma_current_screening_state.py'
          p=Path(test); text=p.read_text(encoding='utf-8')
          v10='    ROOT / "empirical" / "prisma" / "SCH_PRISMA_V2_SCREENING_DECISIONS_V10_BATCH2_HIGH_INFORMATION_EXCLUSIONS.csv",\n'
          v11='    ROOT / "empirical" / "prisma" / "SCH_PRISMA_V2_SCREENING_DECISIONS_V11_BATCH2_FULLTEXT_CLOSURE.csv",\n'
          if v11 not in text: text=text.replace(v10,v10+v11,1)
          for old,new in {
            'def test_batch2_high_information_fulltext_backlog_is_reduced_by_v10() -> None:':'def test_batch2_high_information_fulltext_queue_is_closed_by_v11() -> None:',
            'assert ft["INCLUDE"] == 35':'assert ft["INCLUDE"] == 44',
            'assert ft["EXCLUDE"] == 44':'assert ft["EXCLUDE"] == 51',
            'assert ft["UNSCREENED"] == 16':'assert ft["UNSCREENED"] == 0',
            'def test_current_evidence_lanes_keep_one_strict_anchor_after_v10_fulltext() -> None:':'def test_current_evidence_lanes_keep_two_strict_measurement_architectures_after_v11() -> None:',
            'assert lanes["STRICT_LINKED_EXPERIMENT"] == 1':'assert lanes["STRICT_LINKED_EXPERIMENT"] == 2',
            'assert lanes["DIRECTIONAL_OR_NEAR_PASS"] == 30':'assert lanes["DIRECTIONAL_OR_NEAR_PASS"] == 38',
            'assert lanes["EVOLUTIONARY_OUTCOME"] == 11':'assert lanes["EVOLUTIONARY_OUTCOME"] == 12',
            'assert [row["record_id"] for row in strict] == ["SCHPRISMA-000031"]':'assert [row["record_id"] for row in strict] == ["SCHPRISMA-000031", "SCHPRISMA-000166"]',
            'assert len(rows) == 35':'assert len(rows) == 44',
            'def test_decision_provenance_remains_explicit_after_v10_fulltext() -> None:':'def test_decision_provenance_remains_explicit_after_v11_fulltext() -> None:',
            'assert sources["ASSISTED_OPENALEX_ABSTRACT_SCREEN_2026-08-30"] == 19':'assert sources["ASSISTED_OPENALEX_ABSTRACT_SCREEN_2026-08-30"] == 3',
          }.items():
              if old not in text: raise RuntimeError(f'test anchor missing {old}')
              text=text.replace(old,new,1)
          anchor='    assert sources["SOURCE_VERIFIED_BATCH2_FULLTEXT_2026-08-30"] == 10\n'
          add='    assert sources["SOURCE_VERIFIED_BATCH2_FULLTEXT_2026-08-31"] == 16\n'
          if add not in text: text=text.replace(anchor,anchor+add,1)
          p.write_text(text,encoding='utf-8')

          led='docs/PUBLICATION_MATERIAL_LEDGER.md'
          pairs=[
            ('## Current screening state — Batch 1 complete, Batch 2 high-information full text in progress','## Current screening state — Batch 1 complete, Batch 2 high-information full text closed'),
            ('Ten of the 26 reports retained from this high-information screen now also have source-verified full-text exclusions, leaving 16 reports undecided at full text.','All 26 reports retained from this high-information screen now have source-verified full-text decisions: nine are included and seventeen are excluded. Batch-2 high-information full-text adjudication is therefore closed.'),
            ('primary studies included:         35','primary studies included:         44'),
            ('full-text excluded:               44','full-text excluded:               51'),
            ('full-text undecided:              16','full-text undecided:               0'),
            ('STRICT_LINKED_EXPERIMENT:           1','STRICT_LINKED_EXPERIMENT:           2'),
            ('DIRECTIONAL_OR_NEAR_PASS:          30','DIRECTIONAL_OR_NEAR_PASS:          38'),
            ('EVOLUTIONARY_OUTCOME:              11','EVOLUTIONARY_OUTCOME:              12'),
            ('The three Batch-2 high-information title/abstract exclusions are non-study objects: two eLife decision letters and one Dryad dataset record. Of the 26 reports retained conservatively for full text, ten are now excluded because they are duplicate/preprint/dissertation reports, review-only records, or lack a declared floral coordinate or one focal consumer channel. These decisions do not change the 35 included studies, the evidence-lane counts, or the eight joint-positive geographic systems. Sixteen retained reports still require full-text adjudication; retention is not inclusion.','The three Batch-2 high-information title/abstract exclusions are non-study objects: two eLife decision letters and one Dryad dataset record. Of the 26 reports retained conservatively for full text, nine are now included and seventeen excluded. The resulting cumulative state is 44 primary inclusions and 51 full-text exclusions. The geography counters remain 8/9/8 because V11 closes evidence eligibility without retroactively inferring geography from titles or author affiliations.'),
            ('The strict linked result remains **Theis & Adler 2012 only**. The gate remains:','The strict linked measurement architecture now occurs in **two** studies: Theis & Adler 2012 and Sánchez-Lafuente 2007 (*Linaria lilacina*). The gate remains:'),
            ('The 44 completed full-text exclusions include review/meta-analysis/species-synthesis records, duplicate reports, records lacking a declared floral `A`, or records lacking one required biological channel.','The 51 completed full-text exclusions include review/meta-analysis/species-synthesis records, duplicate reports, records lacking a declared floral `A`, or records lacking one required biological channel.'),
            ('It remains **UNRESOLVED, NOW EMPIRICALLY PLAUSIBLE**, not submission-ready: 730 records remain title/abstract unscreened, 16 retained reports await full-text coding, and no common geography-by-cue-overlap estimand has passed independence/scale checks.','It remains **UNRESOLVED, NOW EMPIRICALLY PLAUSIBLE**, not submission-ready: 730 records remain title/abstract unscreened, and no common geography-by-cue-overlap estimand has passed independence/scale checks.'),
            ('| Batch 2 high-information | 29/29 TA decisions; 26 retained; 10 FT exclusions | Prioritized second-batch gate | Full-text adjudicate remaining 16, then screen remaining 71 Batch-2 records |','| Batch 2 high-information | 29/29 TA decisions; 26 retained; 26/26 FT decided | Prioritized second-batch gate | Closed; next screen remaining 71 Batch-2 records |'),
            ('| Formal screening cumulative | 138 TA decisions; 35 primary includes; FT backlog 16 | Evidence lanes and blockers | Complete Batch 2 and remaining batches |','| Formal screening cumulative | 138 TA decisions; 44 primary includes; current FT backlog 0 | Evidence lanes and blockers | Continue title/abstract screening: 730 remain |'),
            ('| Strict experiment | Theis & Adler 2012 | One strict linked directional anchor | Uncertainty-bearing focal A effect unavailable |','| Strict experiments | Theis & Adler 2012; Sánchez-Lafuente 2007 | Two strict linked measurement architectures | Neither closes simultaneous positive pollinator and antagonist response to the same manipulated A |'),
            ('| Figure 2 | PRISMA flow + strict/near-pass/evolutionary lanes | Frozen denominator; 138 TA decisions; 44 FT exclusions; 16 FT undecided |','| Figure 2 | PRISMA flow + strict/near-pass/evolutionary lanes | Frozen denominator; 138 TA decisions; 51 FT exclusions; 0 FT undecided |'),
            ('| Table 1 | Systematic study decisions/blockers | 138 screened; 35 primary includes; 16 FT pending |','| Table 1 | Systematic study decisions/blockers | 138 TA screened; 44 primary includes; current FT queue closed |'),
          ]
          for old,new in pairs: rep(led,old,new)
          p=Path(led); text=p.read_text(encoding='utf-8')
          marker='The strict linked measurement architecture now occurs in **two** studies: Theis & Adler 2012 and Sánchez-Lafuente 2007 (*Linaria lilacina*). The gate remains:'
          para='The two passes sharpen rather than close the conflict claim. In Theis & Adler, enhanced fragrance increased florivore attraction and reduced seed production but did not produce a detected increase in pollinator attraction. In *Linaria*, corolla manipulation changed pollinator response and reproduction, while fruit-predator visitation was not affected by the manipulation. Thus linked measurement architecture now replicates across two systems, but a single manipulated `A` showing both positive pollinator response and positive antagonist response remains unrecovered.\n\n'
          text=text.replace(marker+'\n\n',marker+'\n\n'+para,1)
          start='### Remaining Batch-2 full-text priority classes\n\n'; end='## Full-text exclusion and independence boundary\n'
          if start in text:
              a=text.index(start); b=text.index(end,a)
              text=text[:a]+'''### Batch-2 high-information full-text closure\n\nAll 26 retained high-information reports have now been adjudicated. V11 contributes nine inclusions and seven exclusions after the ten V10 exclusions. The next systematic work object is the remaining 71 Batch-2 title/abstract records, followed by later batches. Full-text closure of the currently retained set does not authorize pooled effects and does not mean the 868-record screen is complete.\n\n'''+text[b:]
          p.write_text(text,encoding='utf-8')

          jbi='docs/SCH_JBI_GEOGRAPHY_PREVIEW_READOUT_V1.md'
          for old,new in [
            ('partial full-text adjudication','complete high-information full-text adjudication'),
            ('Of the 26 retained at that stage, ten now have source-verified full-text exclusions and 16 remain undecided.','All 26 retained at that stage now have source-verified full-text decisions: nine are included and seventeen are excluded.'),
            ('primary full-text inclusions:           35','primary full-text inclusions:           44'),
            ('full-text exclusions:                   44','full-text exclusions:                   51'),
            ('full-text undecided among retained:     16','full-text undecided among retained:      0'),
            ('STRICT_LINKED_EXPERIMENT:                1','STRICT_LINKED_EXPERIMENT:                2'),
            ('DIRECTIONAL_OR_NEAR_PASS:               30','DIRECTIONAL_OR_NEAR_PASS:               38'),
            ('EVOLUTIONARY_OUTCOME:                   11','EVOLUTIONARY_OUTCOME:                   12'),
            ('The Batch-2 high-information title/abstract screen excluded two peer-review/decision-letter objects and one dataset record. Ten additional retained reports were excluded at full text because they were duplicate reports, review-only records, lacked a declared floral coordinate, or lacked one focal consumer channel. These exclusions leave the included-study, evidence-lane and geography counts unchanged.','The Batch-2 high-information title/abstract screen excluded two peer-review/decision-letter objects and one dataset record. Full-text adjudication of all 26 retained reports is now complete. The cumulative included-study and evidence-lane counts increase, while the geography counters remain unchanged at 8/9/8 because V11 does not infer spatial contrasts from unreported metadata.'),
            ('- the strict linked-experiment count remains Theis & Adler 2012 only.','- strict linked measurement architecture is now replicated in Theis & Adler 2012 and Sánchez-Lafuente 2007, but neither study demonstrates simultaneous positive pollinator and antagonist responses to the same manipulated `A`.'),
            ('Batch 2 high-information FT exclusions: 10/26 retained reports','Batch 2 high-information FT decisions:  26/26 retained reports'),
            ('current retained full-text backlog:     16','current retained full-text backlog:      0'),
            ('The remaining Batch-2 queue may add linked systems, but the strict count is intentionally held at one until full-text four-field coding is complete.','The Batch-2 high-information full-text queue is now closed. The strict count is two, but both are measurement-architecture passes with complementary nulls rather than a closed positive dual-audience conflict chain.'),
            ('The next work object is the **remaining 16-report Batch-2 high-information full-text queue**, followed by the remaining 71 Batch-2 title/abstract records.','The next work object is the **remaining 71 Batch-2 title/abstract records**, followed by later screening batches.'),
          ]: rep(jbi,old,new)
          p=Path(jbi); text=p.read_text(encoding='utf-8')
          start='## Remaining Batch-2 geography candidates remain provisional\n\n'; end='## High-information non-geographic boundary cases\n'
          if start in text:
              a=text.index(start); b=text.index(end,a)
              text=text[:a]+'''## Batch-2 high-information geography closure\n\nThe previously provisional 16-report full-text queue has been adjudicated. Several records add useful receiver-overlap or multisite context, but none is promoted into the joint-positive geography counter without explicit source-coded geographic and receiver-regime fields. The positive geography / receiver / joint counts therefore remain 8 / 9 / 8. This prevents multisite sampling or a network label from being mistaken for demonstrated geographic receiver turnover.\n\n'''+text[b:]
          p.write_text(text,encoding='utf-8')

          man='manuscript/MANUSCRIPT_SHARED_CUE_FRAMEWORK.md'
          rep(man,'- **Theis & Adler 2012:** current directional-only coverage pass; enhanced fragrance increased florivore attraction and reduced seed production, without a detected pollinator-attraction increase.','- **Theis & Adler 2012:** one of two current strict linked measurement-architecture passes; enhanced fragrance increased florivore attraction and reduced seed production, without a detected pollinator-attraction increase.\n- **Sánchez-Lafuente 2007, *Linaria lilacina*:** the second strict linked measurement-architecture pass; experimental corolla damage changed pollinator response and reproduction while fruit-predator visitation showed no treatment response.')
          p=Path(man); text=p.read_text(encoding='utf-8')
          anchor='- **Knauer, Bakhtiari & Schiestl 2018:** antagonist removal by crab spiders changes the ecological context of floral-signal evolution; a mechanism/context anchor rather than a current strict coverage pass.\n'
          add='\nThe strict gate is therefore now **replicated as measurement architecture (2 studies)**, but the central positive dual-audience chain remains open. Theis & Adler supplies directional antagonist cost with a non-detected pollinator-attraction increase; *Linaria* supplies directional pollinator/reproductive effects with a null fruit-predator response to the manipulated `A`. Neither study demonstrates the same manipulated floral coordinate simultaneously increasing pollinator response and antagonist response.\n'
          if add not in text: text=text.replace(anchor,anchor+add,1)
          p.write_text(text,encoding='utf-8')

          Path('docs/SCH_PRISMA_V11_BATCH2_FULLTEXT_CLOSURE_READOUT.md').write_text('''# SCH PRISMA V11 — Batch-2 high-information full-text closure\n\n## Machine-audited state\n\n```text\nfrozen denominator:                    868\ntitle/abstract screened:               138\nretained for full text:                 95\ntitle/abstract excluded:                43\nTA unscreened:                         730\n\nreports assessed at full text:          95\nprimary studies included:               44\nfull-text excluded:                     51\ncurrent full-text undecided:             0\n\nSTRICT_LINKED_EXPERIMENT:                2\nDIRECTIONAL_OR_NEAR_PASS:               38\nEVOLUTIONARY_OUTCOME:                   12\n\npositive geographic contrasts:          8\npositive receiver contrasts:             9\njoint geography + receiver:              8\n```\n\nThe full-text queue for all currently retained reports is closed, but the systematic screen is not complete because 730 frozen records remain title/abstract unscreened. Screening completion does not authorize pooling; independence, outcome-scale and commensurability gates remain separate.\n\n## Strict-gate result\n\nThe strict four-field measurement architecture now appears in two studies. Theis & Adler 2012 manipulates fragrance and measures pollinator response, florivore response and seed production, but no increase in pollinator attraction was detected. Sánchez-Lafuente 2007 (*Linaria lilacina*) manipulates corolla structure and measures pollinator response, fruit-predator visitation and reproduction, but fruit-predator visitation did not respond to the treatment.\n\n> **Strict linked measurement architecture replicates (2 studies), but no recovered experiment yet shows the same manipulated attraction coordinate producing both a positive pollinator response and a positive antagonist response on a common reproductive surface.**\n''',encoding='utf-8')
          PY
      - name: Validate non-workflow V11 state
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_sch_prisma_current_screening_state.py tests/test_sch_prisma_decision_overlay.py tests/test_sch_bita_scope_contract.py
      - name: Commit non-workflow V11 state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_sch_prisma_current_screening_state.py docs/PUBLICATION_MATERIAL_LEDGER.md docs/SCH_JBI_GEOGRAPHY_PREVIEW_READOUT_V1.md docs/SCH_PRISMA_V11_BATCH2_FULLTEXT_CLOSURE_READOUT.md manuscript/MANUSCRIPT_SHARED_CUE_FRAMEWORK.md empirical/prisma/SCH_PRISMA_V2_SCREENING_DECISIONS_V11_BATCH2_FULLTEXT_CLOSURE.csv
          git commit -m 'Synchronize V11 screening state and claim ceiling'
          git push origin HEAD:analysis/prisma-batch2-fulltext-closure-v1
