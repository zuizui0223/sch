name: SCH original blueberry same-tag flower visitation and compatibility gate
on:
  pull_request:
    paths:
      - 'scripts/analyze_sch_blueberry_2020_matched_flower_gate.py'
      - 'tests/test_sch_blueberry_2020_matched_flower_gate.py'
      - '.github/workflows/sch_blueberry_2020_matched_flower_gate.yml'
      - 'docs/SCH_BLUEBERRY_2020_MATCHED_FLOWER_GATE_REANALYSIS_V1.md'
      - 'data/SCH_BLUEBERRY_2020_GENUINE_FLOWER_GATE_V1.csv'
  push:
    paths:
      - 'scripts/analyze_sch_blueberry_2020_matched_flower_gate.py'
      - 'tests/test_sch_blueberry_2020_matched_flower_gate.py'
      - '.github/workflows/sch_blueberry_2020_matched_flower_gate.yml'
      - 'docs/SCH_BLUEBERRY_2020_MATCHED_FLOWER_GATE_REANALYSIS_V1.md'
      - 'data/SCH_BLUEBERRY_2020_GENUINE_FLOWER_GATE_V1.csv'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  authentic-source-flower-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original plant cluster logistic and bootstrap model dependencies
        run: python -m pip install --quiet numpy scipy statsmodels pytest
      - name: Run source grain and no-causal-promotion tests
        run: python -m pytest -q tests/test_sch_blueberry_2020_matched_flower_gate.py
      - name: Recover MD5-verified original 2020 flower CSVs from signed source-ingress run
        uses: actions/download-artifact@v4
        with:
          name: sch-original-2020-blueberry-flower-source
          run-id: 43907335688
          github-token: ${{ github.token }}
          path: artifacts/sch_blueberry_original_gate/
      - name: Recompute actual tagged-flower fruit risk, cross vs self compatibility and cluster-aware visit response
        run: >-
          python -m scripts.analyze_sch_blueberry_2020_matched_flower_gate
          --source_dir artifacts/sch_blueberry_original_gate
          --out artifacts/sch_blueberry_original_gate/actual_flower_fruit_gate_v1.json
          --bootstrap 1999
      - name: Verify genuine source identities and independent biological units
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path("artifacts/sch_blueberry_original_gate/actual_flower_fruit_gate_v1.json").read_text())
          assert r["n_independent_source_research_programmes"]==1
          assert r["n_original_source_files"]==3
          assert r["original_source_file_receipts"]["multiple"]["n_tagged_flower_rows"]==2080
          assert r["original_source_file_receipts"]["pollination"]["n_tagged_flower_rows"]==2125
          assert r["original_source_file_receipts"]["single"]["n_tagged_flower_rows"]==1309
          c=r["original_same_flower_hand_cross_versus_self_fruit_set"]
          assert c["original_cross_self_flower_rows"]==676
          assert c["n_valid_cluster_bootstrap"]>=1900
          v=r["original_visit_count_to_same_flower_fruit_set"]
          assert v["site_and_plant_cluster_aware_binomial_models"]["visits_0to5"]["n_original_flower_rows"]==1849
          assert r["no_individual_flower_pollen_deposition_or_fertilization_measured"] is True
          assert r["no_SCH_pure_function_optima_or_empirical_loss_L"] is True
          print("PASSED_REAL_ORIGINAL_TAGGED_FLOWER_COMPATIBILITY_GATE_ANALYSIS")
          PY
      - name: Preserve original MD5-verified flower records and full source analysis
        uses: actions/upload-artifact@v4
        with:
          name: sch-original-blueberry-2020-same-flower-compatibility-gate
          path: artifacts/sch_blueberry_original_gate/
          retention-days: 20
          if-no-files-found: error
