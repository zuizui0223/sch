name: Harvest SCH PRISMA identification V2

on:
  pull_request:
    paths:
      - 'scripts/harvest_sch_prisma_candidates.py'
      - 'scripts/harvest_sch_prisma_candidates_v2.py'
      - 'scripts/build_sch_prisma_screening_batches.py'
      - 'scripts/audit_sch_prisma_screening.py'
      - 'scripts/build_sch_prisma_screening_triage.py'
      - 'scripts/build_sch_prisma_human_review_queue.py'
      - 'scripts/apply_sch_prisma_screening_decisions.py'
      - 'tests/test_sch_prisma_harvester_v2.py'
      - 'tests/test_sch_prisma_screening_batches.py'
      - 'tests/test_sch_prisma_screening_audit.py'
      - 'tests/test_sch_prisma_screening_triage.py'
      - 'tests/test_sch_prisma_human_review_queue.py'
      - 'tests/test_sch_prisma_decision_overlay.py'
      - 'tests/test_sch_prisma_prior_anchor_migration_preview.py'
      - 'empirical/prisma/SCH_PRISMA_V2_SCREENING_DECISIONS_V1.csv'
      - 'empirical/prisma/SCH_PRISMA_V2_PRIOR_ANCHOR_FULLTEXT_MIGRATION_PREVIEW_V1.csv'
      - 'docs/SCH_PRISMA_SEARCH_PROTOCOL_V2.md'
      - 'docs/SCH_PRISMA_V1_IDENTIFICATION_READOUT.md'
      - 'docs/SCH_PRISMA_V2_IDENTIFICATION_READOUT.md'
      - '.github/workflows/harvest-sch-prisma-identification-v2.yml'
  workflow_dispatch:

jobs:
  identify-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test V2 identification and screening-workspace rules
        run: |
          python -m pip install pytest
          python -m pytest -q \
            tests/test_sch_prisma_harvester.py \
            tests/test_sch_prisma_harvester_v2.py \
            tests/test_sch_prisma_screening_batches.py \
            tests/test_sch_prisma_screening_audit.py \
            tests/test_sch_prisma_screening_triage.py \
            tests/test_sch_prisma_human_review_queue.py \
            tests/test_sch_prisma_decision_overlay.py \
            tests/test_sch_prisma_prior_anchor_migration_preview.py
      - name: Run registered OpenAlex V2 identification
        run: |
          mkdir -p artifacts/sch_prisma_v2
          python scripts/harvest_sch_prisma_candidates_v2.py \
            artifacts/sch_prisma_v2/SCH_PRISMA_V2_IDENTIFIED_CANDIDATES.csv \
            artifacts/sch_prisma_v2/SCH_PRISMA_V2_IDENTIFICATION_RECEIPT.json \
            --cap 2500
      - name: Require complete registered retrieval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/sch_prisma_v2/SCH_PRISMA_V2_IDENTIFICATION_RECEIPT.json')
          data = json.loads(p.read_text())
          assert data['systematic_completion_status'] == 'PRISMA_V2_IDENTIFICATION_COMPLETE', data
          assert data['any_truncated_query'] is False, data
          assert data['stored_abstracts'] is False
          assert data['crossref_discovery'] is False
          assert data['deduplicated_unscreened_candidates'] == 868, data
          PY
      - name: Build deterministic title-abstract screening workspace
        run: |
          python scripts/build_sch_prisma_screening_batches.py \
            artifacts/sch_prisma_v2/SCH_PRISMA_V2_IDENTIFIED_CANDIDATES.csv \
            artifacts/sch_prisma_v2/screening_batches \
            --batch-size 100
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/sch_prisma_v2/screening_batches/SCH_PRISMA_V2_SCREENING_PROGRESS.json')
          data = json.loads(p.read_text())
          assert data['screening_denominator'] == 868, data
          assert data['batch_count'] == 9, data
          assert data['screening_status'] == 'TITLE_ABSTRACT_NOT_STARTED', data
          assert data['known_anchor_sensitivity']['all_known_anchors_recovered'] is True, data
          assert data['known_anchor_sensitivity']['recovered_anchor_count'] == 8, data
          PY
      - name: Audit untouched screening workspace and freeze PRISMA zero-count baseline
        run: |
          python scripts/audit_sch_prisma_screening.py \
            artifacts/sch_prisma_v2/screening_batches \
            artifacts/sch_prisma_v2/SCH_PRISMA_V2_SCREENING_AUDIT_BASELINE.json \
            --expected-denominator 868
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/sch_prisma_v2/SCH_PRISMA_V2_SCREENING_AUDIT_BASELINE.json')
          data = json.loads(p.read_text())
          assert data['screening_status'] == 'TITLE_ABSTRACT_NOT_STARTED', data
          assert data['identified_records'] == 868, data
          assert data['title_abstract']['unscreened'] == 868, data
          assert data['prisma_flow']['records_screened_title_abstract'] == 0, data
          assert data['prisma_flow']['records_excluded_title_abstract'] == 0, data
          assert data['prisma_flow']['studies_included'] == 0, data
          PY
      - name: Apply version-controlled author screening decisions
        run: |
          python scripts/apply_sch_prisma_screening_decisions.py \
            artifacts/sch_prisma_v2/screening_batches \
            empirical/prisma/SCH_PRISMA_V2_SCREENING_DECISIONS_V1.csv \
            artifacts/sch_prisma_v2/screening_active \
            artifacts/sch_prisma_v2/SCH_PRISMA_V2_DECISION_OVERLAY_RECEIPT.json \
            --expected-denominator 868
          python scripts/audit_sch_prisma_screening.py \
            artifacts/sch_prisma_v2/screening_active \
            artifacts/sch_prisma_v2/SCH_PRISMA_V2_SCREENING_AUDIT_CURRENT.json \
            --expected-denominator 868
          python - <<'PY'
          import json
          from pathlib import Path
          overlay = json.loads(Path('artifacts/sch_prisma_v2/SCH_PRISMA_V2_DECISION_OVERLAY_RECEIPT.json').read_text())
          current = json.loads(Path('artifacts/sch_prisma_v2/SCH_PRISMA_V2_SCREENING_AUDIT_CURRENT.json').read_text())
          assert current['identified_records'] == 868, current
          assert current['screening_status'] in {
              'TITLE_ABSTRACT_NOT_STARTED',
              'TITLE_ABSTRACT_IN_PROGRESS',
              'FULLTEXT_IN_PROGRESS',
              'SCREENING_COMPLETE',
          }, current
          assert overlay['changed_record_count'] <= overlay['overlay_rows'], overlay
          PY
      - name: Build abstract-free Batch 1 triage packet
        run: |
          mkdir -p artifacts/sch_prisma_v2/screening_packets
          python scripts/build_sch_prisma_screening_triage.py \
            artifacts/sch_prisma_v2/screening_batches/SCH_PRISMA_V2_SCREEN_BATCH_01.csv \
            artifacts/sch_prisma_v2/screening_packets/SCH_PRISMA_V2_BATCH_01_MACHINE_TRIAGE.csv \
            artifacts/sch_prisma_v2/screening_packets/SCH_PRISMA_V2_BATCH_01_MACHINE_TRIAGE_RECEIPT.json
          python - <<'PY'
          import csv, json
          from pathlib import Path
          csv_path = Path('artifacts/sch_prisma_v2/screening_packets/SCH_PRISMA_V2_BATCH_01_MACHINE_TRIAGE.csv')
          receipt_path = Path('artifacts/sch_prisma_v2/screening_packets/SCH_PRISMA_V2_BATCH_01_MACHINE_TRIAGE_RECEIPT.json')
          with csv_path.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle))
          data = json.loads(receipt_path.read_text())
          assert len(rows) == 100, len(rows)
          assert data['candidate_count'] == 100, data
          assert data['known_anchor_count'] == 2, data
          assert data['stored_abstracts'] is False, data
          assert data['formal_decisions_written'] is False, data
          assert all(row['formal_title_abstract_decision'] == '' for row in rows)
          assert all(row['formal_title_abstract_reason'] == '' for row in rows)
          assert 'abstract' not in {name.lower() for name in rows[0]}, rows[0].keys()
          PY
      - name: Build non-anchor high-information human review queue
        run: |
          python scripts/build_sch_prisma_human_review_queue.py \
            artifacts/sch_prisma_v2/screening_packets/SCH_PRISMA_V2_BATCH_01_MACHINE_TRIAGE.csv \
            artifacts/sch_prisma_v2/screening_packets/SCH_PRISMA_V2_BATCH_01_HUMAN_REVIEW_QUEUE.csv \
            artifacts/sch_prisma_v2/screening_packets/SCH_PRISMA_V2_BATCH_01_HUMAN_REVIEW_QUEUE_RECEIPT.json
          python - <<'PY'
          import csv, json
          from pathlib import Path
          csv_path = Path('artifacts/sch_prisma_v2/screening_packets/SCH_PRISMA_V2_BATCH_01_HUMAN_REVIEW_QUEUE.csv')
          receipt_path = Path('artifacts/sch_prisma_v2/screening_packets/SCH_PRISMA_V2_BATCH_01_HUMAN_REVIEW_QUEUE_RECEIPT.json')
          with csv_path.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle))
          data = json.loads(receipt_path.read_text())
          assert len(rows) == 32, len(rows)
          assert data['selected_record_count'] == 32, data
          assert data['priority_counts']['HIGH_TITLE_TRIPLE'] == 3, data
          assert data['priority_counts']['HIGH_TITLE_PAIR'] == 29, data
          assert data['known_anchors_excluded_from_queue'] is True, data
          assert data['stored_abstracts'] is False, data
          assert data['formal_prisma_decisions_written'] is False, data
          assert all(row['human_title_abstract_decision'] == '' for row in rows)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sch-prisma-identification-v2
          path: artifacts/sch_prisma_v2/
          if-no-files-found: error
