name: Validate SCH PRISMA V2 frozen cohort

on:
  pull_request:
    paths:
      - 'scripts/harvest_sch_prisma_candidates.py'
      - 'scripts/harvest_sch_prisma_candidates_v2.py'
      - 'scripts/compare_sch_prisma_v2_live_drift.py'
      - 'scripts/build_sch_prisma_screening_batches.py'
      - 'scripts/audit_sch_prisma_screening.py'
      - 'scripts/build_sch_prisma_screening_triage.py'
      - 'scripts/build_sch_prisma_human_review_queue.py'
      - 'scripts/apply_sch_prisma_screening_decisions.py'
      - 'tests/test_sch_prisma_*.py'
      - 'tests/test_sch_jbi_geography_anchor_preview.py'
      - 'empirical/prisma/frozen_v2/**'
      - 'empirical/prisma/SCH_PRISMA_V2_SCREENING_DECISIONS_*.csv'
      - 'empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_*.csv'
      - 'empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_*.json'
      - 'empirical/prisma/triage/SCH_PRISMA_V2_BATCH_04_*.csv'
      - 'empirical/prisma/triage/SCH_PRISMA_V2_BATCH_04_*.json'
      - 'docs/SCH_PRISMA_*.md'
      - 'docs/SCH_JBI_GEOGRAPHY_PREVIEW_READOUT_V1.md'
      - '.github/workflows/harvest-sch-prisma-identification-v2.yml'
  workflow_dispatch:

jobs:
  frozen-screening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test frozen-cohort and screening contracts
        run: |
          python -m pip install pytest
          python -m pytest -q \
            tests/test_sch_prisma_harvester.py \
            tests/test_sch_prisma_harvester_v2.py \
            tests/test_sch_prisma_live_drift.py \
            tests/test_sch_prisma_screening_batches.py \
            tests/test_sch_prisma_screening_audit.py \
            tests/test_sch_prisma_screening_triage.py \
            tests/test_sch_prisma_human_review_queue.py \
            tests/test_sch_prisma_decision_overlay.py \
            tests/test_sch_prisma_prior_anchor_migration_preview.py \
            tests/test_sch_prisma_current_screening_state.py \
            tests/test_sch_jbi_geography_anchor_preview.py

      - name: Verify immutable 868-record cohort and apply all overlays
        run: |
          set -euo pipefail
          FROZEN=empirical/prisma/frozen_v2/SCH_PRISMA_V2_IDENTIFIED_CANDIDATES_FROZEN_2026-08-29.csv
          test "$(($(wc -l < "$FROZEN")-1))" -eq 868
          echo 'ee85f56ae500be17ed45f9010b0a75fa8f6b741b0967db5af596b2d7bb8579a0  empirical/prisma/frozen_v2/SCH_PRISMA_V2_IDENTIFIED_CANDIDATES_FROZEN_2026-08-29.csv' | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('empirical/prisma/frozen_v2/SCH_PRISMA_V2_IDENTIFICATION_RECEIPT_FROZEN_2026-08-29.json').read_text())
          assert d['protocol_version']=='SCH_PRISMA_V2',d
          assert d['systematic_completion_status']=='PRISMA_V2_IDENTIFICATION_COMPLETE',d
          assert d['raw_openalex_records_retrieved']==10953,d
          assert d['automated_concept_pass_hits_across_queries']==2107,d
          assert d['deduplicated_unscreened_candidates']==868,d
          assert d['any_truncated_query'] is False,d
          PY
          mkdir -p artifacts/sch_prisma_v2
          python scripts/build_sch_prisma_screening_batches.py "$FROZEN" artifacts/sch_prisma_v2/base --batch-size 100
          SRC=artifacts/sch_prisma_v2/base
          mapfile -t overlays < <(find empirical/prisma -maxdepth 1 -type f -name 'SCH_PRISMA_V2_SCREENING_DECISIONS_V*.csv' -print | sort -V)
          python - <<'PY'
          import re
          from pathlib import Path
          rx=re.compile(r'SCREENING_DECISIONS_V(\d+)')
          paths=sorted(Path('empirical/prisma').glob('SCH_PRISMA_V2_SCREENING_DECISIONS_V*.csv'),key=lambda p:int(rx.search(p.name).group(1)))
          versions=[int(rx.search(p.name).group(1)) for p in paths]
          assert versions==list(range(1,21)),versions
          assert paths[-1].name=='SCH_PRISMA_V2_SCREENING_DECISIONS_V20_BATCH4_REMAINDER_TITLE_ABSTRACT.csv',paths[-1]
          PY
          for i in "${!overlays[@]}"; do
            n=$((i+1))
            OUT="artifacts/sch_prisma_v2/active_${n}"
            python scripts/apply_sch_prisma_screening_decisions.py "$SRC" "${overlays[$i]}" "$OUT" "artifacts/sch_prisma_v2/overlay_${n}.json" --expected-denominator 868
            SRC="$OUT"
          done
          rm -rf artifacts/sch_prisma_v2/screening_active
          cp -a "$SRC" artifacts/sch_prisma_v2/screening_active
          python scripts/audit_sch_prisma_screening.py "$SRC" artifacts/sch_prisma_v2/SCH_PRISMA_V2_SCREENING_AUDIT_CURRENT.json --expected-denominator 868

      - name: Require Batch 4 title-abstract closure under V20
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/sch_prisma_v2/SCH_PRISMA_V2_SCREENING_AUDIT_CURRENT.json').read_text())
          assert d['analysis_id']=='sch_prisma_v2_screening_audit_v2',d
          assert d['identified_records']==868,d
          assert d['title_abstract']['retained_for_fulltext']==277,d
          assert d['title_abstract']['excluded']==128,d
          assert d['title_abstract']['unscreened']==463,d
          assert d['fulltext']['eligible_after_title_abstract']==277,d
          assert d['fulltext']['included']==117,d
          assert d['fulltext']['decision_excluded']==131,d
          assert d['fulltext']['assessed_excluded']==130,d
          assert d['fulltext']['unavailable']==1,d
          assert d['fulltext']['unscreened']==29,d
          assert d['evidence_lane_counts']['STRICT_LINKED_EXPERIMENT']==2,d
          assert d['evidence_lane_counts']['DIRECTIONAL_OR_NEAR_PASS']==104,d
          assert d['evidence_lane_counts']['EVOLUTIONARY_OUTCOME']==39,d
          assert d['evidence_lane_counts']['HISTORICAL_TRANSITION']==4,d
          assert d['geography']['geographic_contrast_positive']==25,d
          assert d['geography']['receiver_assemblage_contrast_positive']==24,d
          assert d['geography']['joint_geographic_receiver_positive']==22,d
          assert d['prisma_flow']['records_screened_title_abstract']==405,d
          assert d['prisma_flow']['reports_sought_for_retrieval']==277,d
          assert d['prisma_flow']['reports_not_retrieved']==1,d
          assert d['prisma_flow']['reports_assessed_for_eligibility']==247,d
          assert d['prisma_flow']['reports_excluded_fulltext']==130,d
          assert d['prisma_flow']['studies_included']==117,d
          PY

      - name: Verify V18-V20 stage provenance without live refetch
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          def read(path):
              with open(path,encoding='utf-8',newline='') as h: return list(csv.DictReader(h))
          v18=read('empirical/prisma/SCH_PRISMA_V2_SCREENING_DECISIONS_V18_BATCH4_HIGH_INFORMATION.csv')
          v19=read('empirical/prisma/SCH_PRISMA_V2_SCREENING_DECISIONS_V19_BATCH4_HIGH_INFORMATION_FULLTEXT.csv')
          v20=read('empirical/prisma/SCH_PRISMA_V2_SCREENING_DECISIONS_V20_BATCH4_REMAINDER_TITLE_ABSTRACT.csv')
          assert len(v18)==57
          assert sum(row['screen_title_abstract']=='RETAIN_FULLTEXT' for row in v18)==46
          assert sum(row['screen_title_abstract']=='EXCLUDE' for row in v18)==11
          assert len(v19)==46
          assert sum(row['screen_fulltext']=='INCLUDE' for row in v19)==28
          assert sum(row['screen_fulltext']=='EXCLUDE' for row in v19)==18
          assert {row['record_id'] for row in v19}=={row['record_id'] for row in v18 if row['screen_title_abstract']=='RETAIN_FULLTEXT'}
          assert {row['decision_source'] for row in v19}=={'SOURCE_VERIFIED_BATCH4_HIGH_INFORMATION_FULLTEXT_V19_2026-09-02'}
          assert len(v20)==41
          assert sum(row['screen_title_abstract']=='RETAIN_FULLTEXT' for row in v20)==29
          assert sum(row['screen_title_abstract']=='EXCLUDE' for row in v20)==12
          assert {row['decision_source'] for row in v20}=={'ASSISTED_BATCH4_REMAINDER_TA_SCREEN_V20_2026-09-02'}
          assert {row['record_id'] for row in v18}.isdisjoint({row['record_id'] for row in v20})
          high=json.loads(Path('empirical/prisma/triage/SCH_PRISMA_V2_BATCH_04_HIGH_INFORMATION_QUEUE_RECEIPT.json').read_text())
          rem=json.loads(Path('empirical/prisma/triage/SCH_PRISMA_V2_BATCH_04_REMAINDER_QUEUE_RECEIPT.json').read_text())
          assert high['new_title_abstract_target_count']==98
          assert high['high_information_queue_count_after_prior_decision_filter']==57
          assert rem['remaining_count']==41 and rem['decided_before_v20']==59
          PY

      - name: Run live OpenAlex drift monitor
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p artifacts/sch_prisma_v2/live
          python scripts/harvest_sch_prisma_candidates_v2.py artifacts/sch_prisma_v2/live/SCH_PRISMA_V2_LIVE_CANDIDATES.csv artifacts/sch_prisma_v2/live/SCH_PRISMA_V2_LIVE_IDENTIFICATION_RECEIPT.json --cap 2500

      - name: Compare live index with frozen cohort
        if: always()
        run: |
          set -euo pipefail
          OUT=artifacts/sch_prisma_v2/SCH_PRISMA_V2_LIVE_INDEX_DRIFT_RECEIPT.json
          if [ -s artifacts/sch_prisma_v2/live/SCH_PRISMA_V2_LIVE_IDENTIFICATION_RECEIPT.json ] && [ -s artifacts/sch_prisma_v2/live/SCH_PRISMA_V2_LIVE_CANDIDATES.csv ]; then
            python scripts/compare_sch_prisma_v2_live_drift.py \
              empirical/prisma/frozen_v2/SCH_PRISMA_V2_IDENTIFIED_CANDIDATES_FROZEN_2026-08-29.csv \
              artifacts/sch_prisma_v2/live/SCH_PRISMA_V2_LIVE_CANDIDATES.csv \
              artifacts/sch_prisma_v2/live/SCH_PRISMA_V2_LIVE_IDENTIFICATION_RECEIPT.json "$OUT" --expected-frozen-denominator 868
          else
            python - <<'PY'
          import json
          from pathlib import Path
          Path('artifacts/sch_prisma_v2/SCH_PRISMA_V2_LIVE_INDEX_DRIFT_RECEIPT.json').write_text(json.dumps({
            'analysis_id':'sch_prisma_v2_live_index_drift_v1','frozen_cohort_status':'LOCKED','frozen_denominator':868,
            'live_status':'LIVE_RETRIEVAL_FAILED_OR_INCOMPLETE','screening_denominator_changed':False,
            'claim_boundary':'Live retrieval failure cannot change the frozen 868-record cohort.'},indent=2))
          PY
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/sch_prisma_v2/SCH_PRISMA_V2_LIVE_INDEX_DRIFT_RECEIPT.json').read_text())
          assert d['frozen_cohort_status']=='LOCKED' and d['frozen_denominator']==868 and d['screening_denominator_changed'] is False,d
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sch-prisma-v2-frozen-screening
          path: artifacts/sch_prisma_v2/
          if-no-files-found: error
