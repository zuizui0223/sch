name: Validate SCH PRISMA V2 frozen cohort

on:
  pull_request:
    paths:
      - 'scripts/harvest_sch_prisma_candidates.py'
      - 'scripts/harvest_sch_prisma_candidates_v2.py'
      - 'scripts/compare_sch_prisma_v2_live_drift.py'
      - 'scripts/build_sch_prisma_screening_batches.py'
      - 'scripts/audit_sch_prisma_screening.py'
      - 'scripts/build_sch_prisma_screening_triage.py'
      - 'scripts/build_sch_prisma_human_review_queue.py'
      - 'scripts/apply_sch_prisma_screening_decisions.py'
      - 'tests/test_sch_prisma_*.py'
      - 'tests/test_sch_jbi_geography_anchor_preview.py'
      - 'empirical/prisma/frozen_v2/**'
      - 'empirical/prisma/SCH_PRISMA_V2_SCREENING_DECISIONS_*.csv'
      - 'empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_*.csv'
      - 'empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_*.json'
      - 'empirical/prisma/SCH_PRISMA_V2_PRIOR_ANCHOR_FULLTEXT_MIGRATION_PREVIEW_V1.csv'
      - 'empirical/prisma/SCH_JBI_GEOGRAPHY_ANCHOR_PREVIEW_V1.csv'
      - 'docs/SCH_PRISMA_*.md'
      - 'docs/SCH_JBI_GEOGRAPHY_PREVIEW_READOUT_V1.md'
      - '.github/workflows/harvest-sch-prisma-identification-v2.yml'
  workflow_dispatch:

jobs:
  frozen-screening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test frozen-cohort and screening contracts
        run: |
          python -m pip install pytest
          python -m pytest -q \
            tests/test_sch_prisma_harvester.py \
            tests/test_sch_prisma_harvester_v2.py \
            tests/test_sch_prisma_live_drift.py \
            tests/test_sch_prisma_screening_batches.py \
            tests/test_sch_prisma_screening_audit.py \
            tests/test_sch_prisma_screening_triage.py \
            tests/test_sch_prisma_human_review_queue.py \
            tests/test_sch_prisma_decision_overlay.py \
            tests/test_sch_prisma_prior_anchor_migration_preview.py \
            tests/test_sch_prisma_current_screening_state.py \
            tests/test_sch_jbi_geography_anchor_preview.py

      - name: Verify immutable 868-record cohort and build baseline workspace
        run: |
          set -euo pipefail
          FROZEN=empirical/prisma/frozen_v2/SCH_PRISMA_V2_IDENTIFIED_CANDIDATES_FROZEN_2026-08-29.csv
          test "$(($(wc -l < "$FROZEN")-1))" -eq 868
          echo 'ee85f56ae500be17ed45f9010b0a75fa8f6b741b0967db5af596b2d7bb8579a0  empirical/prisma/frozen_v2/SCH_PRISMA_V2_IDENTIFIED_CANDIDATES_FROZEN_2026-08-29.csv' | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('empirical/prisma/frozen_v2/SCH_PRISMA_V2_IDENTIFICATION_RECEIPT_FROZEN_2026-08-29.json').read_text())
          assert data['protocol_version']=='SCH_PRISMA_V2',data
          assert data['systematic_completion_status']=='PRISMA_V2_IDENTIFICATION_COMPLETE',data
          assert data['raw_openalex_records_retrieved']==10953,data
          assert data['automated_concept_pass_hits_across_queries']==2107,data
          assert data['deduplicated_unscreened_candidates']==868,data
          assert data['any_truncated_query'] is False,data
          PY
          mkdir -p artifacts/sch_prisma_v2
          python scripts/build_sch_prisma_screening_batches.py "$FROZEN" artifacts/sch_prisma_v2/screening_batches --batch-size 100
          python scripts/audit_sch_prisma_screening.py artifacts/sch_prisma_v2/screening_batches artifacts/sch_prisma_v2/SCH_PRISMA_V2_SCREENING_AUDIT_BASELINE.json --expected-denominator 868

      - name: Apply ordered version-controlled decision overlays
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          paths=list(Path('empirical/prisma').glob('SCH_PRISMA_V2_SCREENING_DECISIONS_V*.csv'))
          versions=[]
          for path in paths:
              m=re.search(r'SCREENING_DECISIONS_V(\d+)',path.name)
              assert m,path
              versions.append(int(m.group(1)))
          assert versions,'no screening overlays'
          versions=sorted(versions)
          assert versions==list(range(1,max(versions)+1)),versions
          PY
          SRC=artifacts/sch_prisma_v2/screening_batches
          mapfile -t overlays < <(find empirical/prisma -maxdepth 1 -type f -name 'SCH_PRISMA_V2_SCREENING_DECISIONS_V*.csv' -print | sort -V)
          for i in "${!overlays[@]}"; do
            n=$((i+1))
            OUT="artifacts/sch_prisma_v2/screening_active_${n}"
            python scripts/apply_sch_prisma_screening_decisions.py "$SRC" "${overlays[$i]}" "$OUT" "artifacts/sch_prisma_v2/SCH_PRISMA_V2_OVERLAY_${n}_RECEIPT.json" --expected-denominator 868
            SRC="$OUT"
          done
          rm -rf artifacts/sch_prisma_v2/screening_active
          cp -a "$SRC" artifacts/sch_prisma_v2/screening_active
          python scripts/audit_sch_prisma_screening.py artifacts/sch_prisma_v2/screening_active artifacts/sch_prisma_v2/SCH_PRISMA_V2_SCREENING_AUDIT_CURRENT.json --expected-denominator 868

      - name: Require Batch 3 high-information title-abstract state under V14
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/sch_prisma_v2/SCH_PRISMA_V2_SCREENING_AUDIT_CURRENT.json').read_text())
          assert d['analysis_id']=='sch_prisma_v2_screening_audit_v2',d
          assert d['identified_records']==868,d
          assert d['screening_status']=='TITLE_ABSTRACT_IN_PROGRESS',d
          assert d['title_abstract']['retained_for_fulltext']==158,d
          assert d['title_abstract']['excluded']==83,d
          assert d['title_abstract']['unscreened']==627,d
          assert d['fulltext']['eligible_after_title_abstract']==158,d
          assert d['fulltext']['included']==53,d
          assert d['fulltext']['decision_excluded']==77,d
          assert d['fulltext']['assessed_excluded']==76,d
          assert d['fulltext']['unavailable']==1,d
          assert d['fulltext']['unscreened']==28,d
          assert d['evidence_lane_counts']['STRICT_LINKED_EXPERIMENT']==2,d
          assert d['evidence_lane_counts']['DIRECTIONAL_OR_NEAR_PASS']==46,d
          assert d['evidence_lane_counts']['EVOLUTIONARY_OUTCOME']==15,d
          assert d['geography']['geographic_contrast_positive']==11,d
          assert d['geography']['receiver_assemblage_contrast_positive']==11,d
          assert d['geography']['joint_geographic_receiver_positive']==10,d
          assert d['prisma_flow']['records_screened_title_abstract']==241,d
          assert d['prisma_flow']['reports_sought_for_retrieval']==158,d
          assert d['prisma_flow']['reports_not_retrieved']==1,d
          assert d['prisma_flow']['reports_assessed_for_eligibility']==129,d
          assert d['prisma_flow']['reports_excluded_fulltext']==76,d
          assert d['prisma_flow']['studies_included']==53,d
          PY

      - name: Verify frozen screening and Batch 3 triage provenance without live refetch
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          active={}
          for path in Path('artifacts/sch_prisma_v2/screening_active').glob('SCH_PRISMA_V2_SCREEN_BATCH_*.csv'):
              with path.open(encoding='utf-8',newline='') as handle:
                  for row in csv.DictReader(handle): active[row['record_id']]=row
          assert all(active[f'SCHPRISMA-{i:06d}']['screen_title_abstract'] in {'RETAIN_FULLTEXT','EXCLUDE'} for i in range(1,201))
          assert all(active[f'SCHPRISMA-{i:06d}']['screen_fulltext'] in {'INCLUDE','EXCLUDE'} for i in range(101,201) if active[f'SCHPRISMA-{i:06d}']['screen_title_abstract']=='RETAIN_FULLTEXT')

          batch3_packet=Path('empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_MACHINE_TRIAGE.csv')
          batch3_receipt=Path('empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_MACHINE_TRIAGE_RECEIPT.json')
          queue=Path('empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_HIGH_INFORMATION_QUEUE.csv')
          queue_receipt=Path('empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_HIGH_INFORMATION_QUEUE_RECEIPT.json')
          assert all(path.exists() for path in [batch3_packet,batch3_receipt,queue,queue_receipt])
          with batch3_packet.open(encoding='utf-8',newline='') as handle: triage=list(csv.DictReader(handle))
          with queue.open(encoding='utf-8',newline='') as handle: queued=list(csv.DictReader(handle))
          triage_meta=json.loads(batch3_receipt.read_text())
          queue_meta=json.loads(queue_receipt.read_text())
          assert len(triage)==100
          assert triage_meta['candidate_count']==100
          assert triage_meta['formal_decisions_written'] is False
          assert len(queued)==33
          assert queue_meta['new_title_abstract_target_count']==99
          assert queue_meta['high_information_queue_count_after_prior_decision_filter']==33
          assert queue_meta['formal_prisma_decisions_written'] is False
          assert 'SCHPRISMA-000219' not in {row['record_id'] for row in queued}
          PY

      - name: Run live OpenAlex drift monitor
        id: live_harvest
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p artifacts/sch_prisma_v2/live
          python scripts/harvest_sch_prisma_candidates_v2.py artifacts/sch_prisma_v2/live/SCH_PRISMA_V2_LIVE_CANDIDATES.csv artifacts/sch_prisma_v2/live/SCH_PRISMA_V2_LIVE_IDENTIFICATION_RECEIPT.json --cap 2500

      - name: Compare live index with frozen screening cohort
        if: always()
        run: |
          set -euo pipefail
          OUT=artifacts/sch_prisma_v2/SCH_PRISMA_V2_LIVE_INDEX_DRIFT_RECEIPT.json
          if [ -s artifacts/sch_prisma_v2/live/SCH_PRISMA_V2_LIVE_IDENTIFICATION_RECEIPT.json ] && [ -s artifacts/sch_prisma_v2/live/SCH_PRISMA_V2_LIVE_CANDIDATES.csv ]; then
            python scripts/compare_sch_prisma_v2_live_drift.py \
              empirical/prisma/frozen_v2/SCH_PRISMA_V2_IDENTIFIED_CANDIDATES_FROZEN_2026-08-29.csv \
              artifacts/sch_prisma_v2/live/SCH_PRISMA_V2_LIVE_CANDIDATES.csv \
              artifacts/sch_prisma_v2/live/SCH_PRISMA_V2_LIVE_IDENTIFICATION_RECEIPT.json "$OUT" --expected-frozen-denominator 868
          else
            python - <<'PY'
          import json
          from pathlib import Path
          out=Path('artifacts/sch_prisma_v2/SCH_PRISMA_V2_LIVE_INDEX_DRIFT_RECEIPT.json')
          out.write_text(json.dumps({
              'analysis_id':'sch_prisma_v2_live_index_drift_v1',
              'frozen_cohort_status':'LOCKED',
              'frozen_denominator':868,
              'live_status':'LIVE_RETRIEVAL_FAILED_OR_INCOMPLETE',
              'screening_denominator_changed':False,
              'claim_boundary':'Live retrieval failure cannot change the frozen 868-record cohort.'
          },indent=2),encoding='utf-8')
          PY
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/sch_prisma_v2/SCH_PRISMA_V2_LIVE_INDEX_DRIFT_RECEIPT.json').read_text())
          assert d['frozen_cohort_status']=='LOCKED',d
          assert d['frozen_denominator']==868,d
          assert d['screening_denominator_changed'] is False,d
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sch-prisma-v2-frozen-screening
          path: artifacts/sch_prisma_v2/
          if-no-files-found: error
