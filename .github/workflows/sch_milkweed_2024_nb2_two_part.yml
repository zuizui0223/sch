name: SCH original milkweed 2024 NB2 and fruit two-part source model
on:
  pull_request:
    paths:
      - 'scripts/analyze_sch_milkweed_2024_nb2_two_part.py'
      - 'tests/test_sch_milkweed_2024_nb2_two_part.py'
      - 'docs/SCH_MILKWEED_2024_NB2_TWO_PART_RATE_V1.md'
      - 'data/SCH_MILKWEED_2024_NB2_TWO_PART_RESULTS_V1.csv'
      - '.github/workflows/sch_milkweed_2024_nb2_two_part.yml'
  push:
    paths:
      - 'scripts/analyze_sch_milkweed_2024_nb2_two_part.py'
      - 'tests/test_sch_milkweed_2024_nb2_two_part.py'
      - 'docs/SCH_MILKWEED_2024_NB2_TWO_PART_RATE_V1.md'
      - 'data/SCH_MILKWEED_2024_NB2_TWO_PART_RESULTS_V1.csv'
      - '.github/workflows/sch_milkweed_2024_nb2_two_part.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-nb2-two-part:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine source model dependencies
        run: python -m pip install --quiet openpyxl numpy scipy statsmodels pytest
      - name: Guard source and causal identification contracts
        run: python -m pytest -q tests/test_sch_milkweed_2024_nb2_two_part.py
      - name: Recover previously verified authentic 2024 original XLSX from this repository's signed Actions source run
        uses: actions/download-artifact@v4
        with:
          name: sch-milkweed-2024-original-poisson-exposure-v1
          run-id: 43893168280
          github-token: ${{ github.token }}
          path: artifacts/sch_milkweed_nb2_source
      - name: Validate source bytes against official publisher XLSX SHA256 and original 103-row source shape
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          original=Path("artifacts/sch_milkweed_nb2_source/original_2024_jpe_appendix_ii.xlsx")
          if not original.is_file():raise ValueError("Original source file missing from previous checksum-verified run")
          raw=original.read_bytes()
          if len(raw)!=38955 or hashlib.sha256(raw).hexdigest()!="d5beb695f1c5f81f03eb74a18937582e99fc2cd1c23bda3598e33ef904bfadfb":
            raise ValueError("Original exact official JPE source bytes changed")
          print("AUTHENTIC_PREVIOUSLY_VERIFIED_JPE_SOURCE_SHA256_MATCH")
          PY
      - name: Run 103-row 102-ID grouped two-stage NB2 plus fruit-positive models
        run: >-
          python -m scripts.analyze_sch_milkweed_2024_nb2_two_part
          --source artifacts/sch_milkweed_nb2_source/original_2024_jpe_appendix_ii.xlsx
          --out artifacts/sch_milkweed_nb2_source/source_nb2_two_part_result.json
          --boot 499
      - name: Verify original numeric grain and noncausal limits
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/sch_milkweed_nb2_source/source_nb2_two_part_result.json").read_text())
          assert r["source_original_xlsx_SHA256"]=="d5beb695f1c5f81f03eb74a18937582e99fc2cd1c23bda3598e33ef904bfadfb"
          assert r["n_original_source_rows"]==103
          assert r["n_original_plant_ID_labels"]==102
          assert r["observed_fruit_zero_stems"]==40
          assert r["observed_insertion_zero_stems"]==27
          assert len(r["original_source_NB2_joint_plant_cluster_stage_contrast"]["trait_effects"])==10
          assert len(r["original_source_predeclared_alpha_grid_sensitivity"])==4
          assert r["source_focal_paired_plant_ID_bootstrap"]["n_completed"]>=400
          assert r["source_plant_outcomes_observational_not_randomized"] is True
          assert r["no_causal_reproductive_component_difference_or_sch_L"] is True
          print("PASSED_AUTHENTIC_ORIGINAL_2024_NB2_ZERO_AND_POSITIVE_TEST")
          PY
      - name: Upload source bytes and numeric evidence receipt
        uses: actions/upload-artifact@v4
        with:
          name: sch-milkweed-2024-original-nb2-two-part-v1
          path: artifacts/sch_milkweed_nb2_source/
          retention-days: 15
          if-no-files-found: error
