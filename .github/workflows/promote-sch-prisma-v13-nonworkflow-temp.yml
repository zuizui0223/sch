name: promote-sch-prisma-v13-nonworkflow-temp

on:
  push:
    branches:
      - analysis/prisma-batch2-fulltext-closure-v2

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/prisma-batch2-fulltext-closure-v2
          fetch-depth: 0
      - name: Synchronize V13 documentation and evidence spine
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text(encoding='utf-8')
              n=text.count(old)
              if n != count:
                  raise RuntimeError(f'{path}: expected {count}, found {n}: {old[:120]!r}')
              p.write_text(text.replace(old,new,count),encoding='utf-8')

          led='docs/PUBLICATION_MATERIAL_LEDGER.md'
          pairs=[
            ('## Current screening state — Batch 1 and Batch 2 title/abstract complete','## Current screening state — Batch 1 and Batch 2 full-text closure complete under V13'),
            ('primary studies included:         44','primary studies included:         53'),
            ('full-text excluded:               51','formal full-text exclusions:      77'),
            ('full-text undecided:              35','full-text undecided:               0'),
            ('DIRECTIONAL_OR_NEAR_PASS:          38','DIRECTIONAL_OR_NEAR_PASS:          46'),
            ('EVOLUTIONARY_OUTCOME:              12','EVOLUTIONARY_OUTCOME:              15'),
            ('V12 adds 70 title/abstract decisions: 35 retain for full text and 35 exclude. The cumulative state is therefore 208 title/abstract decisions, 130 retained reports and 78 title/abstract exclusions. The 35 newly retained reports have not yet been full-text adjudicated, so the current full-text backlog is 35. Included-study, evidence-lane and geography counts remain at their V11 values until those full texts are coded.','V13 adjudicates all 35 reports newly retained by V12: nine are included, twenty-five are assessed full-text exclusions, and one is a retrieval failure (`FT_FULLTEXT_UNAVAILABLE`). Cumulatively, 53 studies are included, 76 assessed reports are excluded at full text, one sought report was not retrieved, and no currently retained report remains undecided.'),
            ('### Batch-2 title/abstract closure\n\nBatch 2 is now 100/100 complete at title/abstract stage. V12 resolves the true remaining set as 70 rather than 71 because `SCHPRISMA-000172` had already been source-adjudicated before the high-information Batch-2 pass. V12 retains 35 reports for full text and excludes 35. The next systematic work object is full-text adjudication of those 35 reports; after that, screening proceeds to Batch 3. This does not authorize pooled effects and does not mean the 868-record screen is complete.','### Batch-2 full-text closure under V13\n\nBatch 2 is 100/100 complete at title/abstract stage and every currently retained Batch-2 report now has a resolved full-text state. V13 adds nine inclusions, twenty-five assessed exclusions and one not-retrieved report. The next systematic work object is Batch-3 title/abstract screening. This does not authorize pooled effects and does not mean the 868-record screen is complete.'),
            ('The 51 completed full-text exclusions include review/meta-analysis/species-synthesis records, duplicate reports, records lacking a declared floral `A`, or records lacking one required biological channel.','The current formal exclusion ledger contains 77 decisions: 76 assessed full-text exclusions plus one `FT_FULLTEXT_UNAVAILABLE` retrieval outcome. The assessed exclusions include review/meta-analysis/species-synthesis records, duplicate reports, records lacking a declared floral `A`, or records lacking one required biological channel. The unavailable report is not counted as assessed for eligibility.'),
            ('positive geographic contrasts:          8\npositive receiver/interactor contrasts: 9\njoint geography + receiver contrasts:   8','positive geographic contrasts:         11\npositive receiver/interactor contrasts:11\njoint geography + receiver records:    10'),
            ('The eight joint-positive records are:','The ten joint-positive records are:'),
            ('SCHPRISMA-000172  Biscutella laevigata\n                   lowland/highland crab-spider regime and beta-ocimene inducibility','SCHPRISMA-000151  Lithophragma bolanderi\n                   two-population floral morphology / pollinator-community / local-efficacy divergence\nSCHPRISMA-000167  Primula farinosa\n                   thesis/manuscript selection mosaic; same research program as SCHPRISMA-000523\nSCHPRISMA-000172  Biscutella laevigata\n                   lowland/highland crab-spider regime and beta-ocimene inducibility'),
            ('Thus the JBI axis is no longer resting on one isolated anchor. It remains **UNRESOLVED, NOW EMPIRICALLY PLAUSIBLE**, not submission-ready: 660 records remain title/abstract unscreened, 35 newly retained reports await full-text adjudication, and no common geography-by-cue-overlap estimand has passed independence/scale checks.','Thus the JBI axis is no longer resting on one isolated anchor. V13 yields 10 joint-positive records but not 10 independent systems: `SCHPRISMA-000167` and `SCHPRISMA-000523` belong to the same *Primula farinosa* research program, so the obvious current upper count is nine independent biological systems before the full independence audit. JBI remains **UNRESOLVED, NOW EMPIRICALLY PLAUSIBLE**, not submission-ready: 660 records remain title/abstract unscreened and no common geography-by-cue-overlap estimand has passed independence/scale checks.'),
            ('| PRISMA V2 | frozen 868 cohort | Immutable systematic denominator | Screen remaining 660 after current Batch-2 full-text closure |','| PRISMA V2 | frozen 868 cohort | Immutable systematic denominator | Screen remaining 660 records beginning with Batch 3 |'),
            ('| Batch 2 | 100/100 TA decisions; V12 adds 35 retained / 35 excluded | Second systematic batch | Full-text adjudicate the 35 newly retained reports |','| Batch 2 | 100/100 TA decisions; all currently retained reports resolved at full text under V13 | Second systematic batch | Closed; proceed to Batch 3 TA screening |'),
            ('| Formal screening cumulative | 208 TA decisions; 44 primary includes; current FT backlog 35 | Evidence lanes and blockers | Close 35 Batch-2 full texts, then continue with 660 unscreened records |','| Formal screening cumulative | 208 TA decisions; 53 primary includes; 76 assessed FT exclusions; 1 not retrieved; FT backlog 0 | Evidence lanes and blockers | Continue title/abstract screening of 660 remaining records |'),
            ('| Geography | 8 joint positive spatial receiver-regime records | JBI axis empirically plausible | Complete screen, independence, common analytic question |','| Geography | 10 joint-positive records; at most 9 obvious independent systems after Primula clustering | JBI axis empirically plausible | Complete screen, finish independence audit, define common analytic question |'),
            ('| Figure 2 | PRISMA flow + strict/near-pass/evolutionary lanes | Frozen denominator; 208 TA decisions; 51 FT exclusions; 35 FT undecided |','| Figure 2 | PRISMA flow + strict/near-pass/evolutionary lanes | Frozen denominator; 208 TA decisions; 53 includes; 76 assessed FT exclusions; 1 not retrieved |'),
            ('| Table 1 | Systematic study decisions/blockers | 208 TA screened; 44 primary includes; 35 FT pending |','| Table 1 | Systematic study decisions/blockers | 208 TA screened; 53 primary includes; current FT backlog 0 |'),
          ]
          for old,new in pairs: replace(led,old,new)
          p=Path(led); text=p.read_text(encoding='utf-8')
          anchor='- **Cassia fistula 2021**: stamen exclusion and pollen functionality recover pollinating-versus-feeding division of labour, supporting partial modularity without a common net-fitness test.\n'
          add='- **Junker & Blüthgen 2010**: the same synthetic floral-scent coordinate attracts bumblebees while repelling ants; this is a clean opposite-receiver same-code near-pass, but it lacks a common plant reproductive outcome.\n- **Kleinschmidt et al. 2023, *Lithophragma bolanderi*–*Greya***: floral morphology, pollinator community, pollination efficacy and oviposition differ between populations, supporting a geographic coevolutionary mosaic without randomized `do(A)`.\n'
          if add not in text:
              if anchor not in text: raise RuntimeError('ledger near-pass anchor missing')
              text=text.replace(anchor,anchor+add,1)
          p.write_text(text,encoding='utf-8')

          jbi='docs/SCH_JBI_GEOGRAPHY_PREVIEW_READOUT_V1.md'
          pairs=[
            ('V12 adjudicates the 70 Batch-2 records that were genuinely undecided after accounting for the prior V1 decision on `SCHPRISMA-000172`: 35 are retained for full text and 35 excluded.','V12 adjudicated the 70 genuinely undecided Batch-2 title/abstract records, and V13 now resolves all 35 reports retained by V12. Nine are included, twenty-five are assessed exclusions and one is not retrieved.'),
            ('primary full-text inclusions:           44','primary full-text inclusions:           53'),
            ('full-text exclusions:                   51','formal full-text exclusions:            77'),
            ('full-text undecided among retained:     35','full-text undecided among retained:      0'),
            ('DIRECTIONAL_OR_NEAR_PASS:               38','DIRECTIONAL_OR_NEAR_PASS:               46'),
            ('EVOLUTIONARY_OUTCOME:                   12','EVOLUTIONARY_OUTCOME:                   15'),
            ('The Batch-2 high-information full-text queue remains closed, and V12 completes the remainder of Batch-2 title/abstract screening. Because the 35 newly retained reports have not yet been full-text coded, included-study and evidence-lane counts remain at 44 / 2 strict / 38 near / 12 evolutionary, and geography counters remain 8/9/8.','Batch 2 is now closed at both title/abstract and current full-text stages. V13 contributes nine inclusions, twenty-five assessed exclusions and one not-retrieved report. Strict remains 2, while near-pass and evolutionary lanes rise to 46 and 15.'),
            ('positive geographic contrast:             8\npositive receiver/interactor contrast:     9\njoint geographic + receiver contrast:      8','positive geographic contrast:            11\npositive receiver/interactor contrast:    11\njoint geographic + receiver records:      10'),
            ('The eight current joint-positive systems are:','The ten current joint-positive records are:'),
            ('SCHPRISMA-000172  Biscutella laevigata\n                   lowland/highland crab-spider regime and beta-ocimene inducibility','SCHPRISMA-000151  Lithophragma bolanderi\n                   two-population pollinator-community and local-efficacy divergence\n\nSCHPRISMA-000167  Primula farinosa\n                   overlapping thesis/manuscript selection mosaic; same program as SCHPRISMA-000523\n\nSCHPRISMA-000172  Biscutella laevigata\n                   lowland/highland crab-spider regime and beta-ocimene inducibility'),
            ('## Batch-2 high-information geography closure','## Batch-2 geography update after V13'),
            ('The previously provisional 16-report full-text queue has been adjudicated. Several records add useful receiver-overlap or multisite context, but none is promoted into the joint-positive geography counter without explicit source-coded geographic and receiver-regime fields. The positive geography / receiver / joint counts therefore remain 8 / 9 / 8. This prevents multisite sampling or a network label from being mistaken for demonstrated geographic receiver turnover.','All currently retained Batch-2 reports are adjudicated. V13 adds explicit geographic/receiver evidence from *Lithophragma bolanderi* and an overlapping *Primula farinosa* thesis/manuscript record. The raw record counters rise to 11 geographic-positive, 11 receiver-positive and 10 joint-positive records. Because the two *Primula farinosa* records belong to one research program, 10 joint records correspond to at most nine obvious independent biological systems before the final independence audit.'),
            ('current retained full-text backlog:     35','current retained full-text backlog:      0'),
            ('multiple joint geographic systems:     YES (8 currently coded)','multiple joint geographic records:      YES (10 records; at most 9 obvious independent systems)'),
            ('The change from historical `1/8` to eight joint-positive systematic records means the geography axis is worth developing.','The change from historical `1/8` to ten joint-positive records across at most nine obvious independent biological systems means the geography axis is worth developing.'),
            ('The next work object is **full-text adjudication of the 35 newly retained Batch-2 reports**. Once that queue closes, title/abstract screening advances to Batch 3.','The next work object is **Batch-3 title/abstract screening**. Independence and outcome-scale coding continue in parallel; screening progress alone does not authorize pooling.'),
          ]
          for old,new in pairs: replace(jbi,old,new)
          p=Path(jbi); text=p.read_text(encoding='utf-8')
          marker='- *Biscutella* supports conditional gating and population differentiation, not ancestral shared-to-private reconstruction;\n'
          add='- *Lithophragma bolanderi* adds a two-population pollinator-community and local-pollination-efficacy mosaic in a pollinating seed-parasite interaction, but floral traits remain observational;\n- the V13 *Primula farinosa* thesis record overlaps the existing PNAS research program and cannot be counted as an independent system;\n'
          if add not in text:
              if marker not in text: raise RuntimeError('JBI boundary anchor missing')
              text=text.replace(marker,marker+add,1)
          p.write_text(text,encoding='utf-8')

          man='manuscript/MANUSCRIPT_SHARED_CUE_FRAMEWORK.md'
          replace(man,
              '- **Junker & Blüthgen 2010:** independent evidence that floral scent responses depend on consumer resource dependence; categories do not map exactly onto pollinator versus antagonist roles.',
              '- **Junker & Blüthgen 2010:** a same-synthetic-scent near-pass in which bumblebees are attracted while ants are repelled; the opposite receiver responses are on the same chemical coordinate, but no common plant reproductive outcome is measured.')
          p=Path(man); text=p.read_text(encoding='utf-8')
          marker='- **Knauer, Bakhtiari & Schiestl 2018:** antagonist removal by crab spiders changes the ecological context of floral-signal evolution; a mechanism/context anchor rather than a current strict coverage pass.\n'
          add='- **Kleinschmidt et al. 2023, *Lithophragma bolanderi*–*Greya*:** population differences in floral morphology and pollinator assemblage are matched by local-versus-nonlocal differences in pollination efficacy and oviposition, supporting a geographic coevolutionary mosaic without a randomized floral `A`.\n'
          if add not in text:
              if marker not in text: raise RuntimeError('manuscript evidence anchor missing')
              text=text.replace(marker,marker+add,1)
          p.write_text(text,encoding='utf-8')

          Path('docs/SCH_PRISMA_V13_BATCH2_FULLTEXT_CLOSURE_READOUT.md').write_text('''# SCH PRISMA V13 — Batch-2 full-text closure\n\n## Machine-audited cumulative state\n\n```text\nfrozen denominator:                    868\ntitle/abstract screened:               208\nretained for full text:                130\ntitle/abstract excluded:                78\nTA unscreened:                         660\n\nreports sought for retrieval:          130\nreports not retrieved:                   1\nreports assessed for eligibility:      129\nprimary studies included:               53\nassessed full-text exclusions:          76\nformal EXCLUDE decisions:               77\ncurrent full-text undecided:             0\n\nSTRICT_LINKED_EXPERIMENT:                2\nDIRECTIONAL_OR_NEAR_PASS:               46\nEVOLUTIONARY_OUTCOME:                   15\n\npositive geographic records:           11\npositive receiver records:              11\njoint geography + receiver records:     10\nobvious independent joint systems:    <= 9\n```\n\n`FT_FULLTEXT_UNAVAILABLE` is now separated from reports assessed for eligibility. `SCHPRISMA-000194` is the single not-retrieved report; it is a formal retrieval/exclusion state, not a biological full-text failure.\n\n## Scientific update\n\nV13 closes the 35-report queue opened by V12 with nine inclusions, twenty-five assessed exclusions and one not-retrieved report. No new strict experiment is admitted. The strict linked measurement architecture therefore remains two studies, and the positive dual-audience chain remains unrecovered.\n\nTwo additions sharpen lower evidence layers. Junker & Blüthgen 2010 places opposite receiver responses on the same synthetic scent coordinate: bumblebees are attracted and ants are repelled, but there is no common plant reproductive outcome. Kleinschmidt et al. 2023 adds a two-population *Lithophragma bolanderi*–*Greya* coevolutionary mosaic with floral morphology, pollinator-community turnover, local pollination efficacy and oviposition differences, but `A` is observational.\n\nThe raw JBI counters rise to 10 joint-positive records. `SCHPRISMA-000167` and `SCHPRISMA-000523` are the same *Primula farinosa* research program, so record count is not independent-system count; the obvious current upper bound is nine independent biological systems pending the full independence audit.\n\n## Provenance boundary\n\n`decision_source` is provenance for an individual versioned sparse overlay. It is not a cumulative history field. V12 retains its 70 title/abstract provenance rows and V13 retains its 35 full-text provenance rows; a merged latest-state view may show the V13 source for records adjudicated at both stages and must not be used to reconstruct stage history.\n\nNo pooled effect is authorized by Batch-2 closure alone.\n''',encoding='utf-8')
          PY
      - name: Validate V13 synchronized prose contracts
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_sch_prisma_current_screening_state.py tests/test_sch_prisma_screening_audit.py tests/test_sch_bita_scope_contract.py
          grep -q 'primary studies included:         53' docs/PUBLICATION_MATERIAL_LEDGER.md
          grep -q '10 records; at most 9 obvious independent systems' docs/SCH_JBI_GEOGRAPHY_PREVIEW_READOUT_V1.md
          grep -q 'reports not retrieved:                   1' docs/SCH_PRISMA_V13_BATCH2_FULLTEXT_CLOSURE_READOUT.md
          grep -q 'same-synthetic-scent near-pass' manuscript/MANUSCRIPT_SHARED_CUE_FRAMEWORK.md
      - name: Commit non-workflow V13 synchronization
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PUBLICATION_MATERIAL_LEDGER.md docs/SCH_JBI_GEOGRAPHY_PREVIEW_READOUT_V1.md docs/SCH_PRISMA_V13_BATCH2_FULLTEXT_CLOSURE_READOUT.md manuscript/MANUSCRIPT_SHARED_CUE_FRAMEWORK.md
          git commit -m 'Synchronize Batch 2 full-text closure state in V13'
          git push origin HEAD:analysis/prisma-batch2-fulltext-closure-v2
