name: SCH global plant functional-trait meta original ingress

on:
  push:
    branches:
      - empirical/global-functional-trait-meta-real-source-20261028
    paths:
      - scripts/ingest_sch_plant_functional_selection_2020_raw.py
      - scripts/audit_sch_plant_functional_meta_grain.py
      - .github/workflows/sch_plant_functional_selection_2020.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original spreadsheet source reader
        run: python -m pip install --quiet openpyxl
      - name: Fetch four pinned original files and report actual workbooks
        run: >-
          python scripts/ingest_sch_plant_functional_selection_2020_raw.py
          --outdir artifacts/plant_functional_selection_original
      - name: Profile true study-level treatment matches and original selection estimands
        run: >-
          python scripts/audit_sch_plant_functional_meta_grain.py
          --outdir artifacts/plant_functional_selection_original
          --output artifacts/plant_functional_selection_original/unduplicated_meta_grain_audit.json
      - name: Save checksum-verified public research sources and schema
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sch-plant-functional-selection-source-5000217
          path: artifacts/plant_functional_selection_original/
          retention-days: 15
          if-no-files-found: error
