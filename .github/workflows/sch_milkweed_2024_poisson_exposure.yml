name: SCH original 2024 milkweed Poisson count-exposure sensitivity
on:
  push:
    paths:
      - 'scripts/analyze_sch_milkweed_2024_poisson_exposure.py'
      - 'tests/test_sch_milkweed_2024_poisson_exposure.py'
      - '.github/workflows/sch_milkweed_2024_poisson_exposure.yml'
      - 'docs/SCH_MILKWEED_2024_POISSON_EXPOSURE_SENSITIVITY_V1.md'
  pull_request:
    paths:
      - 'scripts/analyze_sch_milkweed_2024_poisson_exposure.py'
      - 'tests/test_sch_milkweed_2024_poisson_exposure.py'
      - '.github/workflows/sch_milkweed_2024_poisson_exposure.yml'
      - 'docs/SCH_MILKWEED_2024_POISSON_EXPOSURE_SENSITIVITY_V1.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-coupled-count:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original data reader and count regression
        run: python -m pip install --quiet openpyxl numpy scipy statsmodels pytest
      - name: Test source and no-conversion boundaries
        run: python -m pytest -q tests/test_sch_milkweed_2024_poisson_exposure.py
      - name: Download the official checksum-pinned source 2024 milkweed Appendix II
        run: python -m scripts.ingest_sch_milkweed_2024_original_appendix --outdir artifacts/sch_milkweed_2024_poisson_original
      - name: Fit original 103-row, 102-ID cluster-robust per-flower rate Poisson models
        run: >-
          python -m scripts.analyze_sch_milkweed_2024_poisson_exposure
          --source artifacts/sch_milkweed_2024_poisson_original/original_2024_jpe_appendix_ii.xlsx
          --output artifacts/sch_milkweed_2024_poisson_original/source_original_count_rate_result.json
      - name: Verify source shape, 10 trait axes and noncausal statistical scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path("artifacts/sch_milkweed_2024_poisson_original/source_original_count_rate_result.json").read_text())
          assert r["source_original_appendix_sha256"]=="d5beb695f1c5f81f03eb74a18937582e99fc2cd1c23bda3598e33ef904bfadfb"
          assert r["n_source_rows"]==103
          assert r["n_distinct_plant_labels"]==102
          for key in ("original_2024_103row_unadjusted_poisson_count_comparison",
                      "original_2024_103row_exposure_offset_poisson_rate_comparison"):
            assert len(r[key]["trait_effects"])==10
            assert r[key]["n_independent_original_plant_label_groups"]==102
          assert len(r["source_duplicate_ID68_exclusion_sensitivity"])==2
          assert r["no_pollen_to_fruit_conversion_probability_estimated"]
          assert r["no_pure_function_optima_or_SCH_L"]
          print("PASSED_ORIGINAL_2024_MILKWEED_SOURCE_POISSON_EXPOSURE")
          PY
      - name: Preserve original publisher appendix and source regression results
        uses: actions/upload-artifact@v4
        with:
          name: sch-milkweed-2024-original-poisson-exposure-v1
          path: artifacts/sch_milkweed_2024_poisson_original/
          retention-days: 15
          if-no-files-found: error
