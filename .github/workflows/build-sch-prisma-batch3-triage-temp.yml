name: build-sch-prisma-batch3-triage-temp

on:
  push:
    branches:
      - analysis/prisma-batch3-triage-v1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/prisma-batch3-triage-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Batch 3 frozen packet and review queue
        run: |
          set -euo pipefail
          FROZEN=empirical/prisma/frozen_v2/SCH_PRISMA_V2_IDENTIFIED_CANDIDATES_FROZEN_2026-08-29.csv
          mkdir -p artifacts/batch3 empirical/prisma/triage
          python scripts/build_sch_prisma_screening_batches.py "$FROZEN" artifacts/batch3/base --batch-size 100
          python scripts/build_sch_prisma_screening_triage.py \
            artifacts/batch3/base/SCH_PRISMA_V2_SCREEN_BATCH_03.csv \
            empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_MACHINE_TRIAGE.csv \
            empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_MACHINE_TRIAGE_RECEIPT.json
          python scripts/build_sch_prisma_human_review_queue.py \
            empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_MACHINE_TRIAGE.csv \
            empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_HIGH_INFORMATION_QUEUE_RAW.csv \
            empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_HIGH_INFORMATION_QUEUE_RAW_RECEIPT.json
          python - <<'PY'
          import csv, json, re
          from pathlib import Path

          prisma=Path('empirical/prisma')
          decided=set()
          for path in sorted(prisma.glob('SCH_PRISMA_V2_SCREENING_DECISIONS_V*.csv')):
              with path.open(encoding='utf-8',newline='') as handle:
                  for row in csv.DictReader(handle):
                      decided.add((row.get('record_id') or '').strip())

          raw=prisma/'triage/SCH_PRISMA_V2_BATCH_03_HIGH_INFORMATION_QUEUE_RAW.csv'
          with raw.open(encoding='utf-8',newline='') as handle:
              reader=csv.DictReader(handle)
              fields=reader.fieldnames
              rows=[{k:(v or '').strip() for k,v in row.items()} for row in reader]
          filtered=[row for row in rows if row['record_id'] not in decided]
          for i,row in enumerate(filtered,start=1): row['review_order']=str(i)
          out=prisma/'triage/SCH_PRISMA_V2_BATCH_03_HIGH_INFORMATION_QUEUE.csv'
          with out.open('w',encoding='utf-8',newline='') as handle:
              writer=csv.DictWriter(handle,fieldnames=fields)
              writer.writeheader(); writer.writerows(filtered)

          batch3={f'SCHPRISMA-{i:06d}' for i in range(201,301)}
          already=sorted(batch3 & decided)
          remaining=sorted(batch3 - decided)
          assert already==['SCHPRISMA-000219'],already
          assert len(remaining)==99
          receipt={
              'analysis_id':'sch_prisma_v2_batch3_high_information_queue_v1',
              'batch3_record_count':100,
              'already_decided_record_ids':already,
              'new_title_abstract_target_count':len(remaining),
              'raw_high_information_count':len(rows),
              'high_information_queue_count_after_prior_decision_filter':len(filtered),
              'formal_prisma_decisions_written':False,
              'claim_boundary':'Machine triage and review ordering are not formal screening decisions. SCHPRISMA-000219 is excluded from new review because it already carries a V1 source-adjudicated decision.'
          }
          (prisma/'triage/SCH_PRISMA_V2_BATCH_03_HIGH_INFORMATION_QUEUE_RECEIPT.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          raw.unlink(); (prisma/'triage/SCH_PRISMA_V2_BATCH_03_HIGH_INFORMATION_QUEUE_RAW_RECEIPT.json').unlink()
          print(json.dumps(receipt,indent=2))
          PY
      - name: Validate Batch 3 packet
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          tri=Path('empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_MACHINE_TRIAGE.csv')
          q=Path('empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_HIGH_INFORMATION_QUEUE.csv')
          with tri.open(encoding='utf-8',newline='') as h: t=list(csv.DictReader(h))
          with q.open(encoding='utf-8',newline='') as h: r=list(csv.DictReader(h))
          meta=json.loads(Path('empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_HIGH_INFORMATION_QUEUE_RECEIPT.json').read_text())
          assert len(t)==100
          assert all(not row['formal_title_abstract_decision'] for row in t)
          assert all(not row['human_title_abstract_decision'] for row in r)
          assert meta['new_title_abstract_target_count']==99
          assert 'SCHPRISMA-000219' not in {row['record_id'] for row in r}
          PY
      - name: Commit Batch 3 triage packet
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_*.csv empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_*.json
          git commit -m 'Build Batch 3 PRISMA triage packet'
          git push origin HEAD:analysis/prisma-batch3-triage-v1
