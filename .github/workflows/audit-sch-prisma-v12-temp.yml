name: audit-sch-prisma-v12-temp

on:
  push:
    branches:
      - analysis/prisma-batch2-title-abstract-closure-v1

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply V1-V12 and audit
        run: |
          set -euo pipefail
          FROZEN=empirical/prisma/frozen_v2/SCH_PRISMA_V2_IDENTIFIED_CANDIDATES_FROZEN_2026-08-29.csv
          mkdir -p artifacts/v12
          python scripts/build_sch_prisma_screening_batches.py "$FROZEN" artifacts/v12/base --batch-size 100
          SRC=artifacts/v12/base
          mapfile -t overlays < <(find empirical/prisma -maxdepth 1 -type f -name 'SCH_PRISMA_V2_SCREENING_DECISIONS_V*.csv' -print | sort -V)
          test "${#overlays[@]}" -eq 12
          test "${overlays[-1]}" = 'empirical/prisma/SCH_PRISMA_V2_SCREENING_DECISIONS_V12_BATCH2_REMAINDER_TITLE_ABSTRACT.csv'
          for i in "${!overlays[@]}"; do
            n=$((i+1)); OUT="artifacts/v12/active_${n}"
            python scripts/apply_sch_prisma_screening_decisions.py "$SRC" "${overlays[$i]}" "$OUT" "artifacts/v12/overlay_${n}.json" --expected-denominator 868
            SRC="$OUT"
          done
          python scripts/audit_sch_prisma_screening.py "$SRC" artifacts/v12/audit.json --expected-denominator 868
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/v12/audit.json').read_text())
          assert d['title_abstract']['retained_for_fulltext']==130,d
          assert d['title_abstract']['excluded']==78,d
          assert d['title_abstract']['unscreened']==660,d
          assert d['fulltext']['eligible_after_title_abstract']==130,d
          assert d['fulltext']['included']==44,d
          assert d['fulltext']['excluded']==51,d
          assert d['fulltext']['unscreened']==35,d
          assert d['evidence_lane_counts']['STRICT_LINKED_EXPERIMENT']==2,d
          assert d['prisma_flow']['records_screened_title_abstract']==208,d
          print(json.dumps(d, indent=2))
          PY
