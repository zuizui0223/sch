name: build-sch-prisma-batch3-remainder-temp

on:
  push:
    branches:
      - analysis/prisma-batch3-remainder-v16

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/prisma-batch3-remainder-v16
          fetch-depth: 0
      - name: Build undecided Batch 3 queue
        run: |
          python - <<'PY'
          import csv, re, json
          from pathlib import Path
          prisma=Path('empirical/prisma')
          decided=set()
          for path in sorted(prisma.glob('SCH_PRISMA_V2_SCREENING_DECISIONS_V*.csv')):
              with path.open(encoding='utf-8',newline='') as h:
                  for row in csv.DictReader(h):
                      if (row.get('screen_title_abstract') or '').strip():
                          decided.add((row.get('record_id') or '').strip())
          tri=prisma/'triage/SCH_PRISMA_V2_BATCH_03_MACHINE_TRIAGE.csv'
          with tri.open(encoding='utf-8',newline='') as h:
              reader=csv.DictReader(h); fields=reader.fieldnames; rows=[{k:(v or '').strip() for k,v in r.items()} for r in reader]
          remaining=[r for r in rows if r['record_id'] not in decided]
          assert len(remaining)==66, len(remaining)
          out=prisma/'triage/SCH_PRISMA_V2_BATCH_03_REMAINDER_QUEUE.csv'
          with out.open('w',encoding='utf-8',newline='') as h:
              writer=csv.DictWriter(h,fieldnames=fields); writer.writeheader(); writer.writerows(remaining)
          meta={
            'analysis_id':'sch_prisma_v2_batch3_remainder_queue_v1',
            'remaining_count':len(remaining),
            'formal_prisma_decisions_written':False,
            'claim_boundary':'Queue only; machine fields do not determine title/abstract decisions.'
          }
          (prisma/'triage/SCH_PRISMA_V2_BATCH_03_REMAINDER_QUEUE_RECEIPT.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          print(json.dumps(meta))
          PY
      - name: Commit queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_REMAINDER_QUEUE.csv empirical/prisma/triage/SCH_PRISMA_V2_BATCH_03_REMAINDER_QUEUE_RECEIPT.json
          git commit -m 'Build Batch 3 remainder queue'
          git push origin HEAD:analysis/prisma-batch3-remainder-v16
